<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f0f13">
<title>NoExcuses</title>
<style>
:root{
  --bg:#0f0f13;--s1:#17171f;--s2:#1e1e2a;--br:rgba(255,255,255,0.07);
  --t1:#eeeef5;--t2:#8080a0;--t3:#3a3a55;
  --ac:#7c6af7;--ac2:#a78bfa;
  --gr:#34d399;--rd:#f87171;--or:#fb923c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;background:var(--bg)}
::-webkit-scrollbar{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}
.screen{flex:1;overflow-y:auto;padding-bottom:95px}
.screen-full{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:16px 18px 12px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;border-bottom:1px solid var(--br)}
.logo{font-size:19px;font-weight:700;letter-spacing:-.3px}
.logo b{color:var(--ac2)}
.nav{position:absolute;bottom:0;left:0;right:0;background:rgba(15,15,19,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--br);display:flex;justify-content:space-around;align-items:center;padding:8px 4px 20px;z-index:100}
.nb{background:none;border:none;color:var(--t3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 10px;font-family:inherit;transition:color .2s}
.nb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb span{font-size:9px;font-weight:600}
.nb.on{color:var(--ac2)}
.addbtn{background:linear-gradient(135deg,var(--ac),var(--ac2));border:none;width:46px;height:46px;border-radius:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(124,106,247,.4);margin-top:-4px;transition:transform .15s;color:#fff;font-size:22px;font-weight:300}
.addbtn:active{transform:scale(.92)}
.pad{padding:18px}
.pg-title{font-size:26px;font-weight:700;margin-bottom:2px;letter-spacing:-.5px}
.pg-sub{color:var(--t2);font-size:13px;margin-bottom:20px}
.sec{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
.hero{background:linear-gradient(145deg,#141428,#1a1535,#0f1a3a);border:1px solid rgba(124,106,247,.18);border-radius:20px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;bottom:-30px;right:-20px;width:120px;height:120px;background:radial-gradient(circle,rgba(167,139,250,.12) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.hero-lbl{font-size:11px;font-weight:600;color:rgba(167,139,250,.7);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.hero-amt{font-size:44px;font-weight:700;line-height:1;letter-spacing:-2px}
.hero-sub{font-size:13px;color:rgba(255,255,255,.4);margin-top:5px}
.prog{height:5px;background:rgba(255,255,255,.07);border-radius:10px;overflow:hidden;margin-top:14px}
.prog-f{height:100%;border-radius:10px;transition:width .6s ease}
.card{background:var(--s1);border:1px solid var(--br);border-radius:14px;padding:14px 16px;margin-bottom:8px;animation:fadeUp .2s ease}
.card.ov{border-color:rgba(248,113,113,.3)}
.lbl{color:var(--t2);font-size:12px;font-weight:500;display:block;margin:14px 0 5px}
input,select,textarea{width:100%;background:var(--s1);border:1.5px solid var(--br);color:var(--t1);padding:12px 14px;border-radius:12px;font-family:inherit;font-size:15px;display:block;-webkit-appearance:none;appearance:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(124,106,247,.12)}
textarea{resize:none}
select option{background:var(--s2)}
.btn{width:100%;border:none;padding:14px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:12px;transition:opacity .15s,transform .1s}
.btn-p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 4px 14px rgba(124,106,247,.3)}
.btn-p:active{opacity:.85}
.btn-g{background:var(--s1);color:var(--t2);border:1.5px solid var(--br)}
.btn-rd{background:rgba(248,113,113,.1);color:var(--rd);border:1.5px solid rgba(248,113,113,.2)}
.hrow{background:var(--s1);border-radius:12px;padding:12px 14px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;border-left:3px solid transparent;animation:fadeUp .15s ease}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;z-index:999}
.modal{background:var(--s1);border:1px solid var(--br);border-radius:24px 24px 0 0;padding:22px 20px 36px;width:100%;max-width:480px;animation:slideUp .3s ease}
.spinner{width:24px;height:24px;border:2px solid var(--s2);border-top:2px solid var(--ac2);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
.divider{height:1px;background:var(--br);margin:14px 0}
.empty{text-align:center;padding:60px 20px;color:var(--t3)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;animation:glow 2s infinite}
/* AUTH */
.auth-wrap{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:30px 24px}
.auth-card{background:var(--s1);border:1px solid var(--br);border-radius:20px;padding:28px 24px;width:100%;max-width:380px;animation:slideUp .3s ease}
.auth-logo{font-size:26px;font-weight:700;text-align:center;margin-bottom:4px}
.auth-logo b{color:var(--ac2)}
.auth-sub{text-align:center;color:var(--t2);font-size:13px;margin-bottom:24px}
.auth-tabs{display:flex;gap:8px;margin-bottom:20px;background:var(--s2);border-radius:10px;padding:4px}
.auth-tab{flex:1;padding:8px;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;background:none;color:var(--t2);transition:all .2s}
.auth-tab.on{background:var(--s1);color:var(--t1);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.err{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);border-radius:10px;padding:10px 13px;color:var(--rd);font-size:13px;margin-top:10px}
.ok{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25);border-radius:10px;padding:10px 13px;color:var(--gr);font-size:13px;margin-top:10px}
.demo-btn{width:100%;margin-top:14px;padding:12px;border-radius:12px;border:1.5px dashed rgba(124,106,247,.3);background:rgba(124,106,247,.05);color:var(--ac2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.demo-btn:active{background:rgba(124,106,247,.1)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
var SURL = "https://fdvhrfivrjjfsuvvhbyh.supabase.co";
var SKEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkdmhyZml2cmpqZnN1dnZoYnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4OTIzOTQsImV4cCI6MjA4ODQ2ODM5NH0.YEanEtUa2rorgBdxXJcCbqnIjYekVz1gQu7OEpx0Isg";

var DEMO_EMAIL = “demo@noexcuses.app”;
var DEMO_PASS  = “demo1234”;

var CATS = [
{id:“food”,     label:“Food & Dining”,    color:”#f87171”},
{id:“shopping”, label:“Shopping”,         color:”#fb923c”},
{id:“transport”,label:“Transport”,        color:”#fbbf24”},
{id:“entertain”,label:“Entertainment”,    color:”#60a5fa”},
{id:“health”,   label:“Health & Fitness”, color:”#34d399”},
{id:“bills”,    label:“Bills & Utilities”,color:”#a78bfa”},
{id:“personal”, label:“Personal Care”,    color:”#f472b6”}
];

var CAT_ICONS = {
food:“F”, shopping:“S”, transport:“T”, entertain:“E”,
health:“H”, bills:“B”, personal:“P”
};

var DEF_B = {total:500,food:100,shopping:80,transport:60,entertain:50,health:60,bills:100,personal:50};
var DEF_S = {food:0,shopping:0,transport:0,entertain:0,health:0,bills:0,personal:0};

var sb = null;

var state = {
page: “auth”,
authTab: “login”,
authEmail: “”, authPass: “”, authName: “”,
authMsg: null, authLoading: false,
user: null, isDemo: false,
budgets: Object.assign({}, DEF_B),
spending: Object.assign({}, DEF_S),
txns: [],
tempB: Object.assign({}, DEF_B),
logAmt: “”, logCat: “food”, logNote: “”,
guilt: null, excuse: “”,
dbReady: false
};

//    UTILS  
function total(sp) {
sp = sp || state.spending;
return Object.values(sp).reduce(function(a,b){return a+b;},0);
}
function rem() { return state.budgets.total - total(); }
function overAll() { return total() > state.budgets.total; }
function overN() { return CATS.filter(function(c){return state.spending[c.id]>state.budgets[c.id];}).length; }
function pct(s,b) { return Math.min((s/Math.max(b,.01))*100,100); }

function mk(tag, cls, txt) {
var e = document.createElement(tag);
if (cls) e.className = cls;
if (txt !== undefined) e.textContent = txt;
return e;
}
function div(cls, txt) { return mk(“div”, cls, txt); }
function setPage(p) { state.page = p; render(); }

function toast(msg, ok) {
var t = div(””, msg);
t.style.cssText = “position:fixed;top:20px;left:50%;transform:translateX(-50%);”
+ “background:” + (ok ? “var(–gr)” : “var(–rd)”) + “;color:#000;”
+ “padding:9px 20px;border-radius:18px;font-size:13px;font-weight:600;”
+ “z-index:9999;white-space:nowrap;animation:slideUp .2s ease”;
document.body.appendChild(t);
setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);}, 2000);
}

//    SUPABASE INIT  
function initSB() {
try {
sb = window.supabase.createClient(SURL, SKEY);
return true;
} catch(e) {
console.error(“Supabase init failed:”, e);
return false;
}
}

//    AUTH  
async function signUp() {
if (!sb) { state.authMsg = {type:“err”, text:“Database not available.”}; render(); return; }
if (!state.authEmail || !state.authPass) { state.authMsg = {type:“err”, text:“Please fill in all fields.”}; render(); return; }
state.authLoading = true; state.authMsg = null; render();
try {
var r = await sb.auth.signUp({email:state.authEmail, password:state.authPass});
if (r.error) throw r.error;
state.authMsg = {type:“ok”, text:“Check your email to confirm your account!”};
state.authTab = “login”;
} catch(e) {
state.authMsg = {type:“err”, text: e.message || “Sign up failed.”};
}
state.authLoading = false; render();
}

async function signIn() {
if (!sb) { state.authMsg = {type:“err”, text:“Database not available.”}; render(); return; }
state.authLoading = true; state.authMsg = null; render();
try {
var r = await sb.auth.signInWithPassword({email:state.authEmail, password:state.authPass});
if (r.error) throw r.error;
state.user = r.data.user;
state.isDemo = false;
await loadUserData();
setPage(“home”);
} catch(e) {
state.authMsg = {type:“err”, text: e.message || “Sign in failed.”};
state.authLoading = false; render();
}
}

async function signInDemo() {
if (!sb) {
// Offline demo
state.user = {id:“demo”, email: DEMO_EMAIL};
state.isDemo = true;
loadDemoData();
setPage(“home”);
return;
}
state.authLoading = true; state.authMsg = null; render();
try {
var r = await sb.auth.signInWithPassword({email:DEMO_EMAIL, password:DEMO_PASS});
if (r.error) {
// Demo account may not exist yet - just use local demo
state.user = {id:“demo”, email: DEMO_EMAIL};
state.isDemo = true;
loadDemoData();
setPage(“home”);
return;
}
state.user = r.data.user;
state.isDemo = true;
loadDemoData();
setPage(“home”);
} catch(e) {
state.user = {id:“demo”, email: DEMO_EMAIL};
state.isDemo = true;
loadDemoData();
setPage(“home”);
}
state.authLoading = false;
}

function loadDemoData() {
state.budgets  = Object.assign({}, DEF_B);
state.spending = {food:65, shopping:90, transport:30, entertain:15, health:20, bills:100, personal:10};
state.txns = [
{id:1, amt:12.50, cat:“food”,     note:“Lunch”,         date:“Today”,      over:false},
{id:2, amt:45.00, cat:“shopping”, note:“New shirt”,     date:“Today”,      over:true},
{id:3, amt:3.50,  cat:“transport”,note:“Bus fare”,      date:“Yesterday”,  over:false},
{id:4, amt:8.00,  cat:“food”,     note:“Coffee”,        date:“Yesterday”,  over:false},
{id:5, amt:25.00, cat:“entertain”,note:“Cinema”,        date:“2 days ago”, over:false}
];
state.tempB = Object.assign({}, state.budgets);
state.dbReady = true;
}

async function signOut() {
if (sb && !state.isDemo) {
try { await sb.auth.signOut(); } catch(e) {}
}
state.user = null; state.isDemo = false;
state.budgets = Object.assign({},DEF_B);
state.spending = Object.assign({},DEF_S);
state.txns = []; state.tempB = Object.assign({},DEF_B);
state.dbReady = false;
setPage(“auth”);
}

//    DATABASE  
async function loadUserData() {
if (!sb || !state.user) return;
var uid = state.user.id;
try {
var br = await sb.from(“budgets”).select(”*”).eq(“user_id”, uid);
if (br.data && br.data.length > 0) {
br.data.forEach(function(r) {
if (r.category===“total”) state.budgets.total = +r.amount;
else if (state.budgets[r.category] !== undefined) state.budgets[r.category] = +r.amount;
});
} else {
await saveAllBudgets();
}
var sr = await sb.from(“spending”).select(”*”).eq(“user_id”, uid);
if (sr.data && sr.data.length > 0) {
sr.data.forEach(function(r) {
if (state.spending[r.category] !== undefined) state.spending[r.category] = +r.amount;
});
} else {
await saveAllSpending();
}
var tr = await sb.from(“transactions”).select(”*”).eq(“user_id”, uid).order(“created_at”,{ascending:false}).limit(100);
if (tr.data) {
state.txns = tr.data.map(function(r){
return {id:r.id, amt:+r.amount, cat:r.category, note:r.note||””, date:r.date||””, over:r.over||false};
});
}
state.tempB = Object.assign({}, state.budgets);
state.dbReady = true;
} catch(e) {
console.error(“loadUserData:”, e);
state.dbReady = false;
}
}

async function saveAllBudgets() {
if (!sb || !state.user || state.isDemo) return;
var uid = state.user.id;
var rows = [{user_id:uid, category:“total”, amount:state.budgets.total}];
CATS.forEach(function(c){rows.push({user_id:uid, category:c.id, amount:state.budgets[c.id]});});
try { await sb.from(“budgets”).upsert(rows, {onConflict:“user_id,category”}); } catch(e) {}
}

async function saveAllSpending() {
if (!sb || !state.user || state.isDemo) return;
var uid = state.user.id;
var rows = CATS.map(function(c){return {user_id:uid, category:c.id, amount:state.spending[c.id]};});
try { await sb.from(“spending”).upsert(rows, {onConflict:“user_id,category”}); } catch(e) {}
}

async function saveSpending(cat, amt) {
if (!sb || !state.user || state.isDemo) return;
try { await sb.from(“spending”).upsert({user_id:state.user.id, category:cat, amount:amt},{onConflict:“user_id,category”}); } catch(e) {}
}

async function saveTxn(tx) {
if (!sb || !state.user || state.isDemo) return;
try { await sb.from(“transactions”).insert({user_id:state.user.id, amount:tx.amt, category:tx.cat, note:tx.note, date:tx.date, over:tx.over}); } catch(e) {}
}

async function resetWeek() {
state.spending = Object.assign({}, DEF_S);
state.txns = [];
if (sb && state.user && !state.isDemo) {
try {
await saveAllSpending();
await sb.from(“transactions”).delete().eq(“user_id”, state.user.id);
} catch(e) {}
}
}

//    ACTIONS  
function addSpend() {
var amt = parseFloat(state.logAmt);
if (!amt || isNaN(amt) || amt <= 0) { toast(“Enter a valid amount”, false); return; }
var ns = Object.assign({}, state.spending);
ns[state.logCat] = (ns[state.logCat]||0) + amt;
var nt = Object.values(ns).reduce(function(a,b){return a+b;},0);
var catOv = ns[state.logCat] > state.budgets[state.logCat];
var totOv = nt > state.budgets.total;
var tx = {id:Date.now(), amt:amt, cat:state.logCat, note:state.logNote, date:new Date().toLocaleDateString(), over:catOv||totOv};
state.spending = ns;
state.txns = [tx].concat(state.txns);
state.logAmt = “”; state.logNote = “”;
saveSpending(state.logCat, ns[state.logCat]);
saveTxn(tx);
if (catOv || totOv) {
var gc = CATS.find(function(c){return c.id===state.logCat;});
state.guilt = {catOv:catOv, totOv:totOv, catName:gc?gc.label:””, catSpent:ns[state.logCat], catBudget:state.budgets[state.logCat], totSpent:nt};
state.excuse = “”;
render();
} else {
toast(“Added!”, true);
render();
}
}

//    PAGES  
function authPage() {
var wrap = div(“auth-wrap”);
var card = div(“auth-card”);
var logo = div(“auth-logo”); logo.innerHTML = “No<b>Excuses</b>”;
var sub  = div(“auth-sub”, “Track your spending. No excuses.”);
card.appendChild(logo);
card.appendChild(sub);

var tabs = div(“auth-tabs”);
var t1 = mk(“button”,“auth-tab”+(state.authTab===“login”?” on”:””),“Sign In”);
var t2 = mk(“button”,“auth-tab”+(state.authTab===“signup”?” on”:””),“Sign Up”);
t1.onclick = function(){ state.authTab=“login”; state.authMsg=null; render(); };
t2.onclick = function(){ state.authTab=“signup”; state.authMsg=null; render(); };
tabs.appendChild(t1); tabs.appendChild(t2);
card.appendChild(tabs);

if (state.authTab === “signup”) {
card.appendChild(mk(“span”,“lbl”,“Name”));
var ni = mk(“input”); ni.type=“text”; ni.placeholder=“Your name”; ni.value=state.authName;
ni.oninput=function(e){state.authName=e.target.value;};
card.appendChild(ni);
}

card.appendChild(mk(“span”,“lbl”,“Email”));
var ei = mk(“input”); ei.type=“email”; ei.placeholder=“you@example.com”; ei.value=state.authEmail;
ei.oninput=function(e){state.authEmail=e.target.value;};
card.appendChild(ei);

card.appendChild(mk(“span”,“lbl”,“Password”));
var pi = mk(“input”); pi.type=“password”; pi.placeholder=“Min 6 characters”; pi.value=state.authPass;
pi.oninput=function(e){state.authPass=e.target.value;};
pi.onkeydown=function(e){if(e.key===“Enter”){ state.authTab===“login”?signIn():signUp(); }};
card.appendChild(pi);

if (state.authMsg) {
card.appendChild(div(state.authMsg.type===“err”?“err”:“ok”, state.authMsg.text));
}

var mainBtn;
if (state.authLoading) {
var ld = div(””); ld.style.cssText=“display:flex;justify-content:center;margin-top:14px”;
ld.appendChild(div(“spinner”)); card.appendChild(ld);
} else {
mainBtn = mk(“button”,“btn btn-p”, state.authTab===“login”?“Sign In”:“Create Account”);
mainBtn.onclick = state.authTab===“login” ? signIn : signUp;
card.appendChild(mainBtn);
}

var demoBtn = mk(“button”,“demo-btn”,“Try Demo Account”);
demoBtn.onclick = signInDemo;
card.appendChild(demoBtn);

wrap.appendChild(card);
return wrap;
}

function homePage() {
var s = div(“screen”), w = div(“pad”);

var hr = new Date().getHours();
var greet = hr<12 ? “Good morning” : hr<17 ? “Good afternoon” : “Good evening”;
var gd = div(””, greet + “!”);
gd.style.cssText = “font-size:13px;color:var(–t2);margin-bottom:14px;font-weight:500”;
w.appendChild(gd);

var ts = total(), r = rem(), ov = overAll();
var hero = div(“hero”);
var amtEl = div(“hero-amt”); amtEl.style.color = ov ? “var(–rd)” : “var(–t1)”;
amtEl.textContent = “$” + ts.toFixed(2);
var subEl = div(“hero-sub”);
if (ov) {
subEl.innerHTML = ‘<span style="color:var(--rd);font-weight:600">$’ + Math.abs(r).toFixed(2) + ’ over limit</span>’;
} else {
subEl.innerHTML = ‘<span style="color:var(--gr);font-weight:600">$’ + r.toFixed(2) + ‘</span> remaining of $’ + state.budgets.total;
}
var prog = div(“prog”); var fill = div(“prog-f”);
fill.style.cssText = “width:” + pct(ts,state.budgets.total) + “%;background:” + (ov ? “var(–rd)” : “linear-gradient(90deg,var(–ac),var(–gr))”);
prog.appendChild(fill);
hero.appendChild(div(“hero-lbl”,“Weekly Spending”));
hero.appendChild(amtEl);
hero.appendChild(subEl);
hero.appendChild(prog);
w.appendChild(hero);

if (state.isDemo) {
var demoBar = div(””); demoBar.style.cssText = “background:rgba(124,106,247,.08);border:1px solid rgba(124,106,247,.2);border-radius:10px;padding:9px 13px;margin-bottom:14px;font-size:12px;color:var(–ac2);font-weight:500;text-align:center”;
demoBar.textContent = “Demo mode - data is not saved”;
w.appendChild(demoBar);
}

w.appendChild(div(“sec”,“Categories”));

CATS.forEach(function(cat) {
var sp = state.spending[cat.id]||0, bu = state.budgets[cat.id], cov = sp>bu;
var card = div(“card” + (cov?” ov”:””));
var icon = div(””); icon.style.cssText = “width:34px;height:34px;border-radius:9px;background:” + cat.color + “18;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:” + cat.color + “;flex-shrink:0”;
icon.textContent = cat.label.substring(0,1);
var info = div(””);
var nm = div(””,cat.label); nm.style.cssText = “font-size:13px;font-weight:600”;
var st2 = div(””); st2.style.cssText = “font-size:11px;color:” + (cov?“var(–rd)”:“var(–t3)”) + “;margin-top:1px”;
st2.textContent = cov ? “$”+(sp-bu).toFixed(2)+” over” : “$”+(bu-sp).toFixed(2)+” left”;
info.appendChild(nm); info.appendChild(st2);
var right = div(””);
var amEl = div(””); amEl.style.cssText = “font-size:17px;font-weight:700;color:” + (cov?“var(–rd)”:“var(–t1)”) + “;text-align:right”;
amEl.textContent = “$” + sp.toFixed(0);
var ofEl = div(””,“of $”+bu); ofEl.style.cssText = “font-size:11px;color:var(–t3);text-align:right”;
right.appendChild(amEl); right.appendChild(ofEl);
var row = div(””); row.style.cssText = “display:flex;align-items:center;gap:10px;margin-bottom:10px”;
row.appendChild(icon); row.appendChild(info);
var spacer = div(””); spacer.style.flex=“1”; row.appendChild(spacer); row.appendChild(right);
var prog2 = div(“prog”); var fill2 = div(“prog-f”);
fill2.style.cssText = “width:” + pct(sp,bu) + “%;background:” + (cov?“var(–rd)”:cat.color);
prog2.appendChild(fill2);
card.appendChild(row); card.appendChild(prog2);
w.appendChild(card);
});

s.appendChild(w); return s;
}

function logPage() {
var s = div(“screen”), w = div(“pad”);
w.appendChild(div(“pg-title”,“Log Spend”));
w.appendChild(div(“pg-sub”,“Track every transaction.”));

w.appendChild(mk(“span”,“lbl”,“Amount ($)”));
var ai = mk(“input”); ai.type=“number”; ai.placeholder=“0.00”; ai.value=state.logAmt;
ai.style.cssText=“font-size:22px;font-weight:700”;
ai.oninput=function(e){state.logAmt=e.target.value;};
w.appendChild(ai);

w.appendChild(mk(“span”,“lbl”,“Category”));
var cs = mk(“select”);
CATS.forEach(function(c){
var o = mk(“option”); o.value=c.id; o.textContent=c.label;
if (c.id===state.logCat) o.selected=true;
cs.appendChild(o);
});
cs.onchange=function(e){state.logCat=e.target.value;};
w.appendChild(cs);

w.appendChild(mk(“span”,“lbl”,“Note (optional)”));
var ni = mk(“input”); ni.type=“text”; ni.placeholder=“What did you buy?”; ni.value=state.logNote;
ni.oninput=function(e){state.logNote=e.target.value;};
ni.onkeydown=function(e){if(e.key===“Enter”)addSpend();};
w.appendChild(ni);

var lb = mk(“button”,“btn btn-p”,“Add Transaction”); lb.onclick=addSpend; w.appendChild(lb);

if (state.txns.length > 0) {
var secEl = div(“sec”,“Recent”); secEl.style.marginTop=“20px”; w.appendChild(secEl);
state.txns.slice(0,3).forEach(function(t){
var ct = CATS.find(function(c){return c.id===t.cat;});
var row = div(“hrow”); row.style.borderLeftColor = t.over ? “var(–rd)” : (ct?ct.color:“var(–ac)”);
var left = div(””); left.style.cssText=“display:flex;align-items:center;gap:9px”;
var ico = div(””); ico.style.cssText=“width:32px;height:32px;border-radius:8px;background:”+(ct?ct.color+“18”:”#a78bfa18”)+”;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:”+(ct?ct.color:“var(–ac)”);
ico.textContent = ct?ct.label.substring(0,1):”?”;
var lbl2 = div(””,ct?ct.label:””); lbl2.style.cssText=“font-size:13px;color:var(–t2)”;
left.appendChild(ico); left.appendChild(lbl2);
var amt2 = div(””,”$”+Number(t.amt).toFixed(2)); amt2.style.cssText=“font-size:15px;font-weight:700;color:”+(t.over?“var(–rd)”:“var(–t1)”);
row.appendChild(left); row.appendChild(amt2);
w.appendChild(row);
});
}

s.appendChild(w); return s;
}

function historyPage() {
var s = div(“screen”), w = div(“pad”);
w.appendChild(div(“pg-title”,“History”));
w.appendChild(div(“pg-sub”,“All your transactions.”));

if (state.txns.length === 0) {
var em = div(“empty”); em.innerHTML=”<div style='font-size:36px;margin-bottom:10px;opacity:.3'>–</div><div style='font-size:13px'>No transactions yet.</div>”;
w.appendChild(em);
} else {
state.txns.forEach(function(t){
var ct = CATS.find(function(c){return c.id===t.cat;});
var row = div(“hrow”); row.style.borderLeftColor = t.over ? “var(–rd)” : (ct?ct.color:“var(–ac)”);
var left = div(””); left.style.cssText=“display:flex;align-items:center;gap:9px”;
var ico = div(””); ico.style.cssText=“width:34px;height:34px;border-radius:9px;background:”+(ct?ct.color+“18”:”#a78bfa18”)+”;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:”+(ct?ct.color:“var(–ac)”);
ico.textContent = ct?ct.label.substring(0,1):”?”;
var info2 = div(””);
var n1 = div(””,ct?ct.label:””); n1.style.cssText=“font-size:13px;font-weight:500”;
var n2 = div(””); n2.style.cssText=“font-size:11px;color:var(–t3);margin-top:1px”; n2.textContent=t.date+(t.note?”   “+t.note:””);
info2.appendChild(n1); info2.appendChild(n2);
left.appendChild(ico); left.appendChild(info2);
var right2 = div(””);
var a2 = div(””,”$”+Number(t.amt).toFixed(2)); a2.style.cssText=“font-size:15px;font-weight:700;color:”+(t.over?“var(–rd)”:“var(–t1)”);
var st3 = div(””,t.over?“Over”:“OK”); st3.style.cssText=“font-size:10px;font-weight:600;color:”+(t.over?“var(–rd)”:“var(–gr)”)+”;text-align:right”;
right2.appendChild(a2); right2.appendChild(st3);
row.appendChild(left); row.appendChild(right2);
w.appendChild(row);
});
var rb = mk(“button”,“btn btn-g”,“Reset Week”); rb.style.marginTop=“14px”;
rb.onclick=function(){
if(confirm(“Reset all spending for a new week?”)){
resetWeek().then(function(){render();});
}
};
w.appendChild(rb);
}
s.appendChild(w); return s;
}

function settingsPage() {
var s = div(“screen”), w = div(“pad”);
w.appendChild(div(“pg-title”,“Settings”));
w.appendChild(div(“pg-sub”,“Budgets and account.”));

// Account card
var ac = div(“card”); ac.style.marginBottom=“6px”;
var albl = div(””,“Account”); albl.style.cssText=“font-size:12px;font-weight:700;color:var(–t2);margin-bottom:10px”;
var ainfo = div(””); ainfo.style.cssText=“display:flex;align-items:center;gap:8px;margin-bottom:12px”;
var adot = div(””); adot.style.cssText=“width:7px;height:7px;border-radius:50%;background:var(–gr)”;
var atxt = div(””); atxt.style.cssText=“font-size:13px;font-weight:500;color:var(–t1)”;
atxt.textContent = state.isDemo ? “Demo Account” : (state.user ? state.user.email : “”);
ainfo.appendChild(adot); ainfo.appendChild(atxt);
var sob = mk(“button”,“btn btn-rd”,“Sign Out”); sob.style.marginTop=“0”;
sob.onclick = function(){ if(confirm(“Sign out?”)){signOut();} };
ac.appendChild(albl); ac.appendChild(ainfo); ac.appendChild(sob);
w.appendChild(ac);

if (state.isDemo) {
var db2 = div(””); db2.style.cssText=“background:rgba(124,106,247,.07);border:1px solid rgba(124,106,247,.15);border-radius:10px;padding:10px 13px;margin-bottom:14px;font-size:12px;color:var(–ac2)”;
db2.textContent=“Demo mode: budget changes won’t be saved.”;
w.appendChild(db2);
}

w.appendChild(div(“divider”));
w.appendChild(div(“sec”,“Weekly Budgets”));
w.appendChild(mk(“span”,“lbl”,“Total Budget ($)”));
var ti = mk(“input”); ti.type=“number”; ti.value=state.tempB.total; ti.style.cssText=“font-size:20px;font-weight:700”;
ti.oninput=function(e){state.tempB=Object.assign({},state.tempB,{total:+e.target.value});};
w.appendChild(ti);
w.appendChild(div(“divider”));

CATS.forEach(function(cat){
var rl = div(””); rl.style.cssText=“display:flex;align-items:center;gap:8px;margin-top:12px;margin-bottom:5px”;
var ico2 = div(””); ico2.style.cssText=“width:26px;height:26px;border-radius:7px;background:”+cat.color+“18;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:”+cat.color;
ico2.textContent=cat.label.substring(0,1);
var nm2 = div(””,cat.label); nm2.style.cssText=“font-size:12px;font-weight:600;color:var(–t2)”;
rl.appendChild(ico2); rl.appendChild(nm2);
var ci = mk(“input”); ci.type=“number”; ci.value=state.tempB[cat.id];
ci.oninput=function(e){ var u=Object.assign({},state.tempB); u[cat.id]=+e.target.value; state.tempB=u; };
w.appendChild(rl); w.appendChild(ci);
});

var svb = mk(“button”,“btn btn-p”,“Save Budgets”);
svb.onclick=function(){
state.budgets=Object.assign({},state.tempB);
saveAllBudgets().then(function(){ toast(“Budgets saved!”, true); render(); });
};
w.appendChild(svb);
s.appendChild(w); return s;
}

function guiltOverlay() {
var g = state.guilt;
var ov = div(“overlay”);
var modal = div(“modal”);
var handle = div(””); handle.style.cssText=“width:32px;height:3px;background:var(–br);border-radius:2px;margin:0 auto 18px”;
modal.appendChild(handle);
var head = div(””); head.style.cssText=“font-size:20px;font-weight:700;text-align:center;margin-bottom:5px”;
head.textContent = g.catOv ? “Over on “ + g.catName : “Weekly budget exceeded”;
var sub2 = div(””); sub2.style.cssText=“text-align:center;color:var(–t2);font-size:13px;margin-bottom:14px”;
sub2.textContent = “Here is what happened”;
modal.appendChild(head); modal.appendChild(sub2);
var bd = div(””); bd.style.cssText=“background:var(–s2);border-radius:12px;padding:12px 14px;margin-bottom:14px”;
if (g.catOv) {
var r1 = div(””); r1.style.cssText=“display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(–br);font-size:13px”;
var s1 = div(””,g.catName); s1.style.color=“var(–t2)”;
var s2 = div(””,”$”+g.catSpent.toFixed(2)+” / $”+g.catBudget); s2.style.cssText=“color:var(–rd);font-weight:600”;
r1.appendChild(s1); r1.appendChild(s2); bd.appendChild(r1);
}
if (g.totOv) {
var r2 = div(””); r2.style.cssText=“display:flex;justify-content:space-between;padding:5px 0;font-size:13px”;
var s3 = div(””,“Weekly Total”); s3.style.color=“var(–t2)”;
var s4 = div(””,”$”+g.totSpent.toFixed(2)+” / $”+state.budgets.total); s4.style.cssText=“color:var(–rd);font-weight:600”;
r2.appendChild(s3); r2.appendChild(s4); bd.appendChild(r2);
}
modal.appendChild(bd);
var nlbl = div(””,“Add a note (min 5 chars to close)”); nlbl.style.cssText=“font-size:12px;font-weight:600;color:var(–t2);margin-bottom:5px”; modal.appendChild(nlbl);
var ta = document.createElement(“textarea”); ta.rows=2; ta.placeholder=“What happened?”; ta.value=state.excuse;
ta.style.cssText=“width:100%;padding:11px 13px;border-radius:10px;font-size:13px;font-family:inherit;margin-bottom:10px;border:1.5px solid var(–br);background:var(–s2);color:var(–t1);resize:none”;
var okb = mk(“button”,“btn btn-p”,“Got it”);
okb.style.cssText+=(state.excuse.trim().length>=5?”;opacity:1”:”;opacity:.4;pointer-events:none”); okb.style.marginTop=“0”;
ta.oninput=function(e){ state.excuse=e.target.value; okb.style.opacity=e.target.value.trim().length>=5?“1”:“0.4”; okb.style.pointerEvents=e.target.value.trim().length>=5?“auto”:“none”; };
okb.onclick=function(){ state.guilt=null; render(); };
modal.appendChild(ta); modal.appendChild(okb); ov.appendChild(modal); return ov;
}

function bottomNav() {
var nav = div(“nav”);
var items = [
{id:“home”, label:“Home”, path:“M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10”},
{id:“history”, label:“History”, path:“M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z M12 6v6l4 2”},
{id:“log”, add:true},
{id:“settings”, label:“More”, path:“M12 20h9 M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z”}
];
items.forEach(function(item){
if (item.add) {
var b = div(“addbtn”,”+”);
b.onclick=function(){setPage(“log”);};
nav.appendChild(b);
} else {
var b2 = mk(“button”,“nb”+(state.page===item.id?” on”:””));
var svg = document.createElementNS(“http://www.w3.org/2000/svg”,“svg”);
svg.setAttribute(“viewBox”,“0 0 24 24”);
svg.setAttribute(“fill”,“none”);
svg.setAttribute(“stroke”,“currentColor”);
svg.setAttribute(“stroke-width”,“1.8”);
svg.setAttribute(“stroke-linecap”,“round”);
svg.setAttribute(“stroke-linejoin”,“round”);
svg.style.cssText=“width:20px;height:20px”;
var paths = item.path.split(” M”).filter(Boolean);
paths.forEach(function(p, i){
var path = document.createElementNS(“http://www.w3.org/2000/svg”,“path”);
path.setAttribute(“d”, (i===0?“M”:””)+p);
svg.appendChild(path);
});
b2.appendChild(svg);
b2.appendChild(mk(“span”,””,item.label));
b2.onclick=function(){setPage(item.id);};
nav.appendChild(b2);
}
});
return nav;
}

function render() {
var app = document.getElementById(“app”);
app.innerHTML = “”;
if (state.page === “auth” || !state.user) {
app.appendChild(authPage());
return;
}
var shell = div(””); shell.style.cssText=“display:flex;flex-direction:column;height:100vh;height:100dvh”;
var tb = div(“topbar”);
var logo = div(“logo”); logo.innerHTML=“No<b>Excuses</b>”;
var oc = overN(), oa = overAll();
var bc = oa?“var(–rd)”:oc>0?“var(–or)”:“var(–gr)”;
var bt = oa?“Over budget”:oc>0?oc+” over”:“On track”;
var badge = div(””); badge.style.cssText=“font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(–s1);color:”+bc;
badge.textContent=bt;
tb.appendChild(logo); tb.appendChild(badge); shell.appendChild(tb);
var pages = {home:homePage, log:logPage, history:historyPage, settings:settingsPage};
shell.appendChild((pages[state.page]||homePage)());
shell.appendChild(bottomNav());
if (state.guilt) shell.appendChild(guiltOverlay());
app.appendChild(shell);
}

//    START  
function start() {
if (!initSB()) {
render();
return;
}
// Check for existing session
sb.auth.getSession().then(function(result) {
var session = result.data && result.data.session;
if (session && session.user) {
state.user = session.user;
state.isDemo = false;
loadUserData().then(function(){ render(); });
} else {
render();
}
}).catch(function() {
render();
});
}

// Wait for Supabase to load then start
if (window.supabase) {
start();
} else {
window.addEventListener(“load”, function() {
setTimeout(start, 100);
});
}
</script>
