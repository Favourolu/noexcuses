<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#0f0f13"/>
  <title>NoExcuses</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap');
    :root {
      --bg: #0f0f13; --surface: #17171f; --surface2: #1e1e2a; --border: rgba(255,255,255,0.07);
      --text: #eeeef5; --text2: #8080a0; --text3: #3a3a55;
      --accent: #7c6af7; --accent2: #a78bfa;
      --green: #34d399; --red: #f87171; --orange: #fb923c;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
    #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); max-width: 480px; margin: 0 auto; position: relative; }
    ::-webkit-scrollbar { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
    @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes fadeUp { from{transform:translateY(8px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes bounce3 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    @keyframes glow { 0%,100%{opacity:0.7} 50%{opacity:1} }
    .screen { flex: 1; overflow-y: auto; padding-bottom: 100px; }
    .screen-full { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .top-bar { padding: 16px 20px 12px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .brand { font-family: 'DM Serif Display', Georgia, serif; font-size: 21px; color: var(--text); }
    .brand em { color: var(--accent2); font-style: italic; }
    .status-pill { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px 5px 9px; font-size: 11px; font-weight: 600; }
    .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(15,15,19,0.97); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding: 8px 4px 22px; z-index: 100; }
    .nav-btn { background: none; border: none; color: var(--text3); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 12px; transition: all 0.2s; }
    .nav-btn svg { width: 20px; height: 20px; transition: all 0.2s; }
    .nav-btn span { font-size: 9px; font-weight: 600; letter-spacing: 0.3px; }
    .nav-btn.active { color: var(--accent2); }
    .add-btn { background: linear-gradient(145deg, var(--accent), var(--accent2)); color: #fff; border: none; width: 48px; height: 48px; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(124,106,247,0.45); margin-top: -4px; transition: transform 0.15s; }
    .add-btn:active { transform: scale(0.93); }
    .page-pad { padding: 20px 18px; }
    .hero { background: linear-gradient(145deg, #141428 0%, #1a1535 60%, #0f1a3a 100%); border: 1px solid rgba(124,106,247,0.18); border-radius: 22px; padding: 22px; margin-bottom: 14px; position: relative; overflow: hidden; animation: fadeUp 0.3s ease; }
    .hero::after { content:''; position:absolute; bottom:-40px; right:-30px; width:160px; height:160px; background: radial-gradient(circle, rgba(167,139,250,0.1) 0%, transparent 70%); border-radius: 50%; pointer-events: none; }
    .hero-eyebrow { font-size: 11px; font-weight: 600; color: rgba(167,139,250,0.7); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
    .hero-amount { font-size: 50px; font-weight: 700; line-height: 1; letter-spacing: -2px; }
    .hero-sub { font-size: 13px; color: rgba(255,255,255,0.45); margin-top: 5px; }
    .bar-bg { height: 5px; background: rgba(255,255,255,0.07); border-radius: 10px; overflow: hidden; margin-top: 16px; }
    .bar-fill { height: 100%; border-radius: 10px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
    .quick-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .quick-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; cursor: pointer; transition: all 0.18s; display: flex; align-items: center; gap: 10px; }
    .quick-card:active { background: var(--surface2); transform: scale(0.98); }
    .quick-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .quick-label { font-size: 12px; font-weight: 600; color: var(--text2); }
    .section-head { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
    .cat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 8px; animation: fadeUp 0.2s ease; }
    .cat-card.over { border-color: rgba(248,113,113,0.3); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px 20px; margin-bottom: 12px; animation: fadeUp 0.2s ease; }
    .card.accent { border-color: rgba(124,106,247,0.25); background: linear-gradient(135deg, rgba(124,106,247,0.06), var(--surface)); }
    .card.green { border-color: rgba(52,211,153,0.25); }
    .page-title { font-family: 'DM Serif Display', Georgia, serif; font-size: 30px; line-height: 1.1; margin-bottom: 3px; }
    .page-sub { color: var(--text2); font-size: 13px; margin-bottom: 22px; }
    .label { color: var(--text2); font-size: 12px; font-weight: 500; display: block; margin: 16px 0 6px; }
    input[type=number], input[type=text], input[type=password], select, textarea {
      width: 100%; background: var(--surface); border: 1.5px solid var(--border); color: var(--text);
      padding: 13px 15px; border-radius: 13px; font-family: 'DM Sans', sans-serif;
      font-size: 15px; display: block; -webkit-appearance: none; appearance: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,106,247,0.12); }
    textarea { resize: none; }
    select option { background: var(--surface2); }
    .btn { width: 100%; border: none; padding: 15px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; margin-top: 14px; transition: opacity 0.15s, transform 0.1s; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 4px 16px rgba(124,106,247,0.3); }
    .btn-primary:active { opacity: 0.88; transform: scale(0.99); }
    .btn-ghost { background: var(--surface); color: var(--text2); border: 1.5px solid var(--border); }
    .spinner { width: 26px; height: 26px; border: 2px solid var(--surface2); border-top: 2px solid var(--accent2); border-radius: 50%; animation: spin 0.75s linear infinite; margin: 0 auto; }
    .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 14px; }
    .scan-box { border: 1.5px dashed rgba(124,106,247,0.25); border-radius: 18px; padding: 32px 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; min-height: 120px; text-align: center; background: rgba(124,106,247,0.03); transition: all 0.2s; }
    .scan-box:active { background: rgba(124,106,247,0.07); }
    .bubble-ai { background: var(--surface); border: 1px solid var(--border); border-radius: 18px 18px 18px 5px; padding: 12px 16px; max-width: 86%; }
    .bubble-user { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 18px 18px 5px 18px; padding: 12px 16px; max-width: 86%; margin-left: auto; }
    .overlay { position: fixed; inset: 0; background: rgba(5,5,10,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: flex-end; justify-content: center; z-index: 999; }
    .guilt-modal { background: var(--surface); border: 1px solid var(--border); border-radius: 28px 28px 0 0; padding: 24px 22px 36px; width: 100%; max-width: 480px; animation: slideUp 0.35s cubic-bezier(0.34,1.3,0.64,1); }
    .verdict-pill { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .ai-label { font-size: 10px; font-weight: 700; color: var(--accent2); letter-spacing: 1px; margin-bottom: 8px; display: block; text-transform: uppercase; }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 5px; animation: glow 2s infinite; }
    .history-row { background: var(--surface); border-radius: 14px; padding: 13px 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid transparent; }
    .divider { height: 1px; background: var(--border); margin: 16px 0; }
    .empty { text-align: center; padding: 60px 20px; color: var(--text3); }
  </style>

</head>
<body>
<div id="app"><div class="loading-screen"><div class="spinner"></div><div style="color:var(--text3);font-size:12px;font-weight:500;animation:pulse 1.5s infinite">Loading your budget...</div></div></div>
<script>
const SUPABASE_URL="https://fdvhrfivrjjfsuvvhbyh.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkdmhyZml2cmpqZnN1dnZoYnloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4OTIzOTQsImV4cCI6MjA4ODQ2ODM5NH0.YEanEtUa2rorgBdxXJcCbqnIjYekVz1gQu7OEpx0Isg";
let sb=null;
// Load Supabase dynamically so app never blocks
function loadSupabase(){
  return new Promise(function(resolve){
    if(window.supabase){
      sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
      resolve();
      return;
    }
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload=function(){sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);resolve();};
    s.onerror=function(){resolve();};
    document.head.appendChild(s);
  });
}
const CATS=[
  {id:"food",label:"Food & Dining",icon:"🍔",color:"#f87171"},
  {id:"shopping",label:"Shopping",icon:"🛍️",color:"#fb923c"},
  {id:"transport",label:"Transport",icon:"🚗",color:"#fbbf24"},
  {id:"entertainment",label:"Entertainment",icon:"🎬",color:"#60a5fa"},
  {id:"health",label:"Health & Fitness",icon:"💪",color:"#34d399"},
  {id:"bills",label:"Bills & Utilities",icon:"⚡",color:"#a78bfa"},
  {id:"personal",label:"Personal Care",icon:"🪥",color:"#f472b6"},
];
const GUILT_MSGS=["Looks like you went a little over 😬","Budget exceeded — let's talk about it 💸","Oops, that pushed you over the limit 📊","You've crossed the line on this one 🚨","Over budget alert — it happens! 👀"];
const DEF_BUDGETS={total:500,food:100,shopping:80,transport:60,entertainment:50,health:60,bills:100,personal:50};
const DEF_SPENDING={food:0,shopping:0,transport:0,entertainment:0,health:0,bills:0,personal:0};
let state={
  apiKey:localStorage.getItem("ne_anthropic_key")||"",
  budgets:{...DEF_BUDGETS},spending:{...DEF_SPENDING},transactions:[],
  page:"dashboard",guiltModal:null,guiltRoast:"",excuseText:"",
  logAmount:"",logCat:"food",logNote:"",scanning:false,scanMsg:null,
  aiInsights:null,aiLoading:false,
  chatMessages:[{role:"ai",text:"Hey! I'm your NoExcuses AI advisor. Ask me anything about your spending and I'll give you honest, helpful feedback. 💜"}],
  chatInput:"",chatLoading:false,tempBudgets:{...DEF_BUDGETS},dbConnected:false,
};

function withTimeout(promise, ms){
return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej(new Error(“timeout”)),ms))]);
}
async function loadFromDB(){
if(!sb){state.dbConnected=false;return;}
try{
const{data:br}=await withTimeout(sb.from(“budgets”).select(”*”), 5000);
if(br&&br.length>0){br.forEach(r=>{if(r.category===“total”)state.budgets.total=r.amount;else state.budgets[r.category]=r.amount;});state.tempBudgets={…state.budgets};}else{try{await withTimeout(initDefaultBudgets(),5000);}catch{}}
const{data:sr}=await withTimeout(sb.from(“spending”).select(”*”), 5000);
if(sr&&sr.length>0)sr.forEach(r=>{state.spending[r.category]=parseFloat(r.amount);});else{try{await withTimeout(initDefaultSpending(),5000);}catch{}}
const{data:tr}=await withTimeout(sb.from(“transactions”).select(”*”).order(“created_at”,{ascending:false}).limit(100), 5000);
if(tr)state.transactions=tr.map(r=>({id:r.id,amount:parseFloat(r.amount),cat:r.category,note:r.note||””,date:r.date,over:r.over}));
state.dbConnected=true;
}catch(e){console.error(“DB load failed:”,e.message);state.dbConnected=false;}
}
async function initDefaultBudgets(){const rows=[{category:“total”,amount:DEF_BUDGETS.total}];CATS.forEach(c=>rows.push({category:c.id,amount:DEF_BUDGETS[c.id]}));await sb.from(“budgets”).upsert(rows,{onConflict:“category”});}
async function initDefaultSpending(){await sb.from(“spending”).upsert(CATS.map(c=>({category:c.id,amount:0})),{onConflict:“category”});}
async function saveBudgetsToDB(){const rows=[{category:“total”,amount:state.budgets.total}];CATS.forEach(c=>rows.push({category:c.id,amount:state.budgets[c.id]}));await sb.from(“budgets”).upsert(rows,{onConflict:“category”});}
async function saveSpendingToDB(cat,amt){await sb.from(“spending”).upsert({category:cat,amount:amt},{onConflict:“category”});}
async function saveTransactionToDB(tx){await sb.from(“transactions”).insert({amount:tx.amount,category:tx.cat,note:tx.note,date:tx.date,over:tx.over});}
async function resetSpendingInDB(){await sb.from(“spending”).upsert(CATS.map(c=>({category:c.id,amount:0})),{onConflict:“category”});await sb.from(“transactions”).delete().neq(“id”,0);}

async function callClaude(messages,system){
const res=await fetch(”/.netlify/functions/claude”,{method:“POST”,headers:{“Content-Type”:“application/json”},body:JSON.stringify({model:“claude-sonnet-4-20250514”,max_tokens:800,system,messages})});
const d=await res.json();if(d.error)throw new Error(d.error.message);
return d.content?.find(b=>b.type===“text”)?.text||””;
}

function pct(s,b){return Math.min((s/Math.max(b,0.01))*100,100);}
function totalSpent(){return Object.values(state.spending).reduce((a,b)=>a+b,0);}
function remaining(){return state.budgets.total-totalSpent();}
function overCount(){return CATS.filter(c=>state.spending[c.id]>state.budgets[c.id]).length;}
function overTotal(){return totalSpent()>state.budgets.total;}
function buildCtx(){
const cats=CATS.map(c=>`${c.label}: $${state.spending[c.id].toFixed(2)} of $${state.budgets[c.id]}`).join(”, “);
const recent=state.transactions.slice(0,8).map(t=>`${t.cat} $${t.amount} ${t.date}`).join(”, “);
return `Weekly budget: $${state.budgets.total}. Spent: $${totalSpent().toFixed(2)}. ${cats}. Recent: ${recent||"none"}.`;
}
function el(tag,attrs={},text){
const e=document.createElement(tag);
for(const[k,v]of Object.entries(attrs)){if(k===“class”)e.className=v;else if(k===“style”)e.style.cssText=v;else e.setAttribute(k,v);}
if(text!==undefined)e.textContent=text;return e;
}
function setPage(p){state.page=p;render();}

async function addSpend(){
const amt=parseFloat(state.logAmount);if(!amt||isNaN(amt))return;
const ns={…state.spending,[state.logCat]:state.spending[state.logCat]+amt};
const nt=Object.values(ns).reduce((a,b)=>a+b,0);
const catOver=ns[state.logCat]>state.budgets[state.logCat],totOver=nt>state.budgets.total;
const tx={amount:amt,cat:state.logCat,note:state.logNote,date:new Date().toLocaleDateString(),over:catOver||totOver};
state.spending=ns;state.transactions=[{id:Date.now(),…tx},…state.transactions];
state.logAmount=””;state.logNote=””;state.scanMsg=null;
saveSpendingToDB(state.logCat,ns[state.logCat]);saveTransactionToDB(tx);
if(catOver||totOver){
state.guiltModal={msg:GUILT_MSGS[Math.floor(Math.random()*GUILT_MSGS.length)],catOver,totOver,catName:CATS.find(c=>c.id===state.logCat)?.label,catSpent:ns[state.logCat],catBudget:state.budgets[state.logCat],totalSpent:nt,totalBudget:state.budgets.total};
state.guiltRoast=””;state.excuseText=””;render();fetchGuiltRoast();
}else{render();}
}

async function fetchGuiltRoast(){
if(!state.apiKey){state.guiltRoast=“Time to review your spending habits and make a plan! 💡”;render();return;}
try{const gd=state.guiltModal;const text=await callClaude([{role:“user”,content:`User overspent on ${gd.catName} by $${Math.max(0,gd.catSpent-gd.catBudget).toFixed(2)}. One honest friendly insight, max 20 words. Context: ${buildCtx()}`}],“Helpful honest financial advisor. One sentence only.”);state.guiltRoast=text.trim().replace(/^”|”$/g,””);}
catch{state.guiltRoast=“Consider reviewing your spending habits and adjusting your budget.”;}
render();
}

async function runAI(){
if(!state.apiKey){alert(“Add your Anthropic API key in Settings to use AI features.”);return;}
state.aiLoading=true;state.aiInsights=null;render();
try{const text=await callClaude([{role:“user”,content:`Analyze and return ONLY valid JSON: {"prediction":"one sentence","verdict":"SAFE or WARNING or DANGER","topRisk":"category id","roast":"one friendly insight","tip":"one specific tip","patterns":["p1","p2","p3"]}. Data: ${buildCtx()}`}],“Helpful financial analyst. Return only valid JSON.”);state.aiInsights=JSON.parse(text.trim());}
catch{state.aiInsights={prediction:“Unable to analyze right now.”,verdict:“WARNING”,topRisk:“food”,roast:“Keep tracking your spending.”,tip:“Set a daily spending limit.”,patterns:[]};}
state.aiLoading=false;render();
}

async function sendChat(){
const msg=state.chatInput.trim();if(!msg)return;
if(!state.apiKey){state.chatMessages=[…state.chatMessages,{role:“ai”,text:“Please add your Anthropic API key in Settings to use the AI advisor! ⚙️”}];render();return;}
state.chatMessages=[…state.chatMessages,{role:“user”,text:msg}];
state.chatInput=””;state.chatLoading=true;render();scrollChatDown();
try{
const apiMsgs=state.chatMessages.map(m=>({role:m.role===“user”?“user”:“assistant”,content:m.text}));
const text=await callClaude(apiMsgs,`Friendly helpful financial advisor. User data: ${buildCtx()}. Be honest but supportive. Max 80 words.`);
state.chatMessages=[…state.chatMessages,{role:“ai”,text}];
}catch{state.chatMessages=[…state.chatMessages,{role:“ai”,text:“Sorry, I couldn’t connect right now. Please try again! 🔄”}];}
state.chatLoading=false;render();setTimeout(scrollChatDown,100);
}

function scrollChatDown(){const e=document.getElementById(“chat-scroll”);if(e)e.scrollTop=e.scrollHeight;}

async function scanReceipt(file){
if(!state.apiKey){state.scanMsg={type:“error”,text:“Add your API key in Settings to scan receipts.”};render();return;}
state.scanning=true;state.scanMsg=null;render();
const reader=new FileReader();
reader.onload=async()=>{
const base64=reader.result.split(”,”)[1];
try{
const res=await fetch(”/.netlify/functions/claude”,{method:“POST”,headers:{“Content-Type”:“application/json”},body:JSON.stringify({model:“claude-sonnet-4-20250514”,max_tokens:300,messages:[{role:“user”,content:[{type:“image”,source:{type:“base64”,media_type:file.type,data:base64}},{type:“text”,text:`Scan receipt. Return ONLY raw JSON: {"amount":24.50,"category":"food","note":"Store name"}. Categories: food,shopping,transport,entertainment,health,bills,personal. Not a receipt: {"error":"x"}.`}]}]})});
const d=await res.json();const text=d.content?.find(b=>b.type===“text”)?.text||””;
const parsed=JSON.parse(text.trim());
if(parsed.error)state.scanMsg={type:“error”,text:“Couldn’t read receipt. Try entering manually.”};
else{state.logAmount=parsed.amount?.toString()||””;state.logCat=parsed.category||“food”;state.logNote=parsed.note||””;state.scanMsg={type:“success”,text:“✓ Receipt scanned!”};}
}catch{state.scanMsg={type:“error”,text:“Scan failed. Please enter manually.”};}
state.scanning=false;render();
};
reader.readAsDataURL(file);
}

function dashPage(){
const s=el(“div”,{class:“screen”}),wrap=el(“div”,{class:“page-pad”});
const ts=totalSpent(),rem=remaining(),over=overTotal();
const hour=new Date().getHours();
wrap.appendChild(el(“div”,{style:“font-size:13px;color:var(–text2);margin-bottom:14px;font-weight:500”},hour<12?“Good morning ☀️”:hour<17?“Good afternoon ⛅”:“Good evening 🌙”));
const hero=el(“div”,{class:“hero”});
hero.innerHTML=`<div class="hero-eyebrow">Weekly Spending</div><div class="hero-amount" style="color:${over?"var(--red)":"var(--text)"}">$${ts.toFixed(2)}</div><div class="hero-sub">${over?`<span style="color:var(--red);font-weight:600">$${Math.abs(rem).toFixed(2)} over limit</span>`:`<span style="color:var(--green);font-weight:600">$${rem.toFixed(2)}</span> remaining of $${state.budgets.total}`}</div><div class="bar-bg"><div class="bar-fill" style="width:${pct(ts,state.budgets.total)}%;background:${over?"var(--red)":"linear-gradient(90deg,var(--accent),var(--green))"}"></div></div>`;
wrap.appendChild(hero);
