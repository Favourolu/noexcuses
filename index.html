<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111">
<title>NoExcuses</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#111;color:#f0f0f0;font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;background:#111}
::-webkit-scrollbar{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.screen{flex:1;overflow-y:auto;padding-bottom:90px}
.screen-full{flex:1;display:flex;flex-direction:column;overflow:hidden}
/* TOP BAR */
.topbar{padding:16px 18px 12px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;border-bottom:1px solid #1e1e1e}
.logo{font-size:18px;font-weight:700;color:#f0f0f0;letter-spacing:-.3px}
.logo span{color:#a78bfa}
.badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:#1e1e1e}
/* BOTTOM NAV */
.nav{position:absolute;bottom:0;left:0;right:0;background:#111;border-top:1px solid #1e1e1e;display:flex;justify-content:space-around;align-items:center;padding:8px 4px 20px;z-index:100}
.nb{background:none;border:none;color:#444;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 10px;font-family:Inter,sans-serif}
.nb svg{width:20px;height:20px}
.nb span{font-size:9px;font-weight:600}
.nb.on{color:#a78bfa}
.addbtn{background:#a78bfa;border:none;width:46px;height:46px;border-radius:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(167,139,250,.4);margin-top:-4px;transition:transform .15s}
.addbtn:active{transform:scale(.92)}
/* LAYOUT */
.pad{padding:18px}
.title{font-size:26px;font-weight:700;margin-bottom:2px;letter-spacing:-.5px}
.sub{color:#555;font-size:13px;margin-bottom:20px}
.sec{font-size:10px;font-weight:700;color:#333;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
/* HERO */
.hero{background:#1a1a2e;border:1px solid #2a2a3e;border-radius:18px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;bottom:-30px;right:-20px;width:120px;height:120px;background:radial-gradient(circle,rgba(167,139,250,.12) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.hero-label{font-size:11px;font-weight:600;color:rgba(167,139,250,.7);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.hero-amount{font-size:46px;font-weight:700;line-height:1;letter-spacing:-2px}
.hero-sub{font-size:13px;color:#555;margin-top:5px}
.hero-sub b{font-weight:600}
.prog{height:5px;background:#1e1e1e;border-radius:10px;overflow:hidden;margin-top:14px}
.prog-fill{height:100%;border-radius:10px;transition:width .6s ease}
/* CARDS */
.card{background:#161616;border:1px solid #1e1e1e;border-radius:14px;padding:14px 16px;margin-bottom:8px;animation:fadeUp .2s ease}
.card.ov{border-color:rgba(248,113,113,.3)}
/* QUICK ROW */
.qrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.qcard{background:#161616;border:1px solid #1e1e1e;border-radius:14px;padding:13px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s}
.qcard:active{background:#1e1e1e}
.qicon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.qlabel{font-size:12px;font-weight:600;color:#666}
/* INPUTS */
.lbl{color:#555;font-size:12px;font-weight:500;display:block;margin:14px 0 5px}
input[type=number],input[type=text],input[type=password],select,textarea{width:100%;background:#161616;border:1.5px solid #1e1e1e;color:#f0f0f0;padding:12px 14px;border-radius:12px;font-family:Inter,sans-serif;font-size:15px;display:block;-webkit-appearance:none;appearance:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#a78bfa}
textarea{resize:none}
select option{background:#161616}
/* BUTTONS */
.btn{width:100%;border:none;padding:14px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;margin-top:12px;transition:opacity .15s}
.btn-p{background:#a78bfa;color:#fff}
.btn-p:active{opacity:.85}
.btn-g{background:#161616;color:#555;border:1.5px solid #1e1e1e}
/* HISTORY */
.hrow{background:#161616;border-radius:12px;padding:12px 14px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;border-left:3px solid transparent}
/* CHAT */
.bai{background:#161616;border:1px solid #1e1e1e;border-radius:16px 16px 16px 4px;padding:11px 14px;max-width:85%}
.buser{background:#a78bfa;border-radius:16px 16px 4px 16px;padding:11px 14px;max-width:85%;margin-left:auto}
/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;z-index:999}
.modal{background:#161616;border:1px solid #1e1e1e;border-radius:24px 24px 0 0;padding:22px 20px 36px;width:100%;max-width:480px;animation:slideUp .3s ease}
.divider{height:1px;background:#1e1e1e;margin:14px 0}
.empty{text-align:center;padding:60px 20px;color:#333}
.spinner{width:24px;height:24px;border:2px solid #1e1e1e;border-top:2px solid #a78bfa;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
.ailbl{font-size:10px;font-weight:700;color:#a78bfa;letter-spacing:1px;margin-bottom:6px;display:block;text-transform:uppercase}
.vpill{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.scan-box{border:1.5px dashed #2a2a2a;border-radius:16px;padding:28px 20px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-align:center;background:rgba(167,139,250,.03);margin-bottom:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
//    STATE (localStorage only, no external deps)                           
var CATS = [
  {id:"food",    label:"Food & Dining",    icon:"Food", color:"#f87171"},
  {id:"shopping",label:"Shopping",         icon:"Shop",  color:"#fb923c"},
  {id:"transport",label:"Transport",       icon:"Car", color:"#fbbf24"},
  {id:"entertain",label:"Entertainment",   icon:"Fun", color:"#60a5fa"},
  {id:"health",  label:"Health & Fitness", icon:"Health", color:"#34d399"},
  {id:"bills",   label:"Bills & Utilities",icon:"Bills", color:"#a78bfa"},
  {id:"personal",label:"Personal Care",    icon:"Care", color:"#f472b6"}
];
var DEF_B = {total:500,food:100,shopping:80,transport:60,entertain:50,health:60,bills:100,personal:50};
var DEF_S = {food:0,shopping:0,transport:0,entertain:0,health:0,bills:0,personal:0};

function loadState() {
try {
var b = localStorage.getItem(“ne_budgets”);
var s = localStorage.getItem(“ne_spending”);
var t = localStorage.getItem(“ne_txns”);
var k = localStorage.getItem(“ne_key”) || “”;
return {
budgets:   b ? JSON.parse(b) : Object.assign({}, DEF_B),
spending:  s ? JSON.parse(s) : Object.assign({}, DEF_S),
txns:      t ? JSON.parse(t) : [],
apiKey:    k,
tempB:     b ? JSON.parse(b) : Object.assign({}, DEF_B)
};
} catch(e) {
return {budgets:Object.assign({},DEF_B), spending:Object.assign({},DEF_S), txns:[], apiKey:””, tempB:Object.assign({},DEF_B)};
}
}

function saveState() {
try {
localStorage.setItem(“ne_budgets”,  JSON.stringify(state.budgets));
localStorage.setItem(“ne_spending”, JSON.stringify(state.spending));
localStorage.setItem(“ne_txns”,     JSON.stringify(state.txns.slice(0,200)));
localStorage.setItem(“ne_key”,      state.apiKey);
} catch(e) {}
}

var saved = loadState();
var state = {
budgets:    saved.budgets,
spending:   saved.spending,
txns:       saved.txns,
apiKey:     saved.apiKey,
tempB:      saved.tempB,
page:       “home”,
logAmt:     “”, logCat: “food”, logNote: “”,
scanning:   false, scanMsg: null,
aiData:     null, aiLoading: false,
chatMsgs:   [{role:“ai”, text:“Hey! Ask me anything about your spending.”}],
chatInput:  “”, chatLoading: false,
guilt:      null, guiltRoast: “”, excuse: “”,
newKey:     “”
};

//    HELPERS  
function total()   { return Object.values(state.spending).reduce(function(a,b){return a+b;},0); }
function rem()     { return state.budgets.total - total(); }
function overAll() { return total() > state.budgets.total; }
function overN()   { return CATS.filter(function(c){return state.spending[c.id]>state.budgets[c.id];}).length; }
function pct(s,b)  { return Math.min((s/Math.max(b,.01))*100,100); }
function ctx() {
var cs = CATS.map(function(c){return c.label+”:$”+state.spending[c.id].toFixed(0)+”/”+state.budgets[c.id];}).join(”,”);
var rc = state.txns.slice(0,6).map(function(t){return t.cat+”$”+t.amt;}).join(”,”);
return “Budget:$”+state.budgets.total+” Spent:$”+total().toFixed(0)+” “+cs+” Recent:”+rc;
}

function el(tag, cls, txt) {
var e = document.createElement(tag);
if (cls) e.className = cls;
if (txt !== undefined) e.textContent = txt;
return e;
}
function div(cls, txt) { return el(“div”, cls, txt); }
function setPage(p) { state.page = p; render(); }

//    AI  
async function ai(msgs, sys) {
var r = await fetch(”/.netlify/functions/claude”, {
method:“POST”, headers:{“Content-Type”:“application/json”},
body: JSON.stringify({model:“claude-sonnet-4-20250514”, max_tokens:600, system:sys, messages:msgs})
});
var d = await r.json();
if (d.error) throw new Error(d.error.message);
var c = d.content || [];
for (var i=0;i<c.length;i++) { if (c[i].type===“text”) return c[i].text; }
return “”;
}

//    ACTIONS  
function addSpend() {
var amt = parseFloat(state.logAmt);
if (!amt || isNaN(amt)) return;
var ns = Object.assign({}, state.spending);
ns[state.logCat] = (ns[state.logCat]||0) + amt;
var nt = Object.values(ns).reduce(function(a,b){return a+b;},0);
var catOv = ns[state.logCat] > state.budgets[state.logCat];
var totOv = nt > state.budgets.total;
var tx = {id:Date.now(), amt:amt, cat:state.logCat, note:state.logNote, date:new Date().toLocaleDateString(), over:catOv||totOv};
state.spending = ns;
state.txns = [tx].concat(state.txns);
state.logAmt = “”; state.logNote = “”; state.scanMsg = null;
saveState();
if (catOv || totOv) {
var gc = CATS.find(function(c){return c.id===state.logCat;});
state.guilt = {catOv:catOv, totOv:totOv, catName:gc?gc.label:””, catSpent:ns[state.logCat], catBudget:state.budgets[state.logCat], totSpent:nt};
state.guiltRoast = “”; state.excuse = “”;
render(); fetchRoast();
} else { render(); }
}

async function fetchRoast() {
if (!state.apiKey) { state.guiltRoast = “Time to review those spending habits!”; render(); return; }
try {
var g = state.guilt;
var t = await ai([{role:“user”,content:“Overspent on “+g.catName+” by $”+Math.max(0,g.catSpent-g.catBudget).toFixed(0)+”. One friendly honest insight, max 15 words. “+ctx()}], “Helpful financial advisor. One sentence.”);
state.guiltRoast = t.trim().replace(/^”|”$/g,””);
} catch(e) { state.guiltRoast = “Consider adjusting your budget for next week.”; }
render();
}

async function runAI() {
if (!state.apiKey) { alert(“Add your API key in Settings first.”); return; }
state.aiLoading = true; state.aiData = null; render();
try {
var t = await ai([{role:“user”,content:’Return ONLY valid JSON no markdown: {“verdict”:“SAFE or WARNING or DANGER”,“prediction”:“one sentence”,“tip”:“one tip”,“roast”:“one insight”,“patterns”:[“x”,“y”,“z”]}. Data: ’+ctx()}], “Financial analyst. Return only valid JSON.”);
state.aiData = JSON.parse(t.trim());
} catch(e) {
state.aiData = {verdict:“WARNING”,prediction:“Could not analyze. Try again.”,tip:“Keep tracking daily.”,roast:“Data is too limited for insights.”,patterns:[]};
}
state.aiLoading = false; render();
}

async function sendChat() {
var msg = state.chatInput.trim(); if (!msg) return;
if (!state.apiKey) { state.chatMsgs = state.chatMsgs.concat([{role:“ai”,text:“Add your API key in Settings to use AI!”}]); render(); return; }
state.chatMsgs = state.chatMsgs.concat([{role:“user”,text:msg}]);
state.chatInput = “”; state.chatLoading = true; render(); scrollChat();
try {
var apiMsgs = state.chatMsgs.map(function(m){return {role:m.role===“user”?“user”:“assistant”,content:m.text};});
var t = await ai(apiMsgs, “Friendly financial advisor. Context: “+ctx()+”. Max 70 words.”);
state.chatMsgs = state.chatMsgs.concat([{role:“ai”,text:t}]);
} catch(e) { state.chatMsgs = state.chatMsgs.concat([{role:“ai”,text:“Connection error. Try again.”}]); }
state.chatLoading = false; render(); setTimeout(scrollChat,80);
}

function scrollChat() { var e=document.getElementById(“cs”); if(e) e.scrollTop=e.scrollHeight; }

async function scanReceipt(file) {
if (!state.apiKey) { state.scanMsg={type:“error”,text:“Add API key in Settings to scan receipts.”}; render(); return; }
state.scanning = true; state.scanMsg = null; render();
var reader = new FileReader();
reader.onload = async function() {
var b64 = reader.result.split(”,”)[1];
try {
var r = await fetch(”/.netlify/functions/claude”,{method:“POST”,headers:{“Content-Type”:“application/json”},body:JSON.stringify({model:“claude-sonnet-4-20250514”,max_tokens:200,messages:[{role:“user”,content:[{type:“image”,source:{type:“base64”,media_type:file.type,data:b64}},{type:“text”,text:‘Scan receipt. Return ONLY JSON: {“amount”:9.99,“category”:“food”,“note”:“store”}. Categories: food,shopping,transport,entertain,health,bills,personal. Not receipt: {“error”:“x”}’}]}]})});
var d = await r.json();
var txt = “”; for(var i=0;i<(d.content||[]).length;i++){if(d.content[i].type===“text”){txt=d.content[i].text;break;}}
var p = JSON.parse(txt.trim());
if (p.error) state.scanMsg={type:“error”,text:“Could not read receipt.”};
else { state.logAmt=String(p.amount||””); state.logCat=p.category||“food”; state.logNote=p.note||””; state.scanMsg={type:“ok”,text:“Receipt scanned!”}; }
} catch(e){ state.scanMsg={type:“error”,text:“Scan failed. Enter manually.”}; }
state.scanning=false; render();
};
reader.readAsDataURL(file);
}

//    PAGES  
function homePage() {
var s=el(“div”,“screen”), w=el(“div”,“pad”);
var hr=new Date().getHours();
w.appendChild(div(””,hr<12?“Good morning AM”:hr<17?“Good afternoon PM”:“Good evening Eve”)).style.cssText=“font-size:13px;color:#444;margin-bottom:14px;font-weight:500”;

// Hero
var ts=total(),r=rem(),ov=overAll();
var hero=div(“hero”);
var amtEl=div(“hero-amount”); amtEl.style.color=ov?”#f87171”:”#f0f0f0”; amtEl.textContent=”$”+ts.toFixed(2);
var subEl=div(“hero-sub”);
if(ov){ var sb=el(“b”); sb.style.color=”#f87171”; sb.textContent=”$”+Math.abs(r).toFixed(2)+” over limit”; subEl.appendChild(sb); }
else { subEl.innerHTML=’<b style="color:#34d399">$’+r.toFixed(2)+’</b> remaining of $’+state.budgets.total; }
var prog=div(“prog”); var fill=div(“prog-fill”); fill.style.cssText=“width:”+pct(ts,state.budgets.total)+”%;background:”+(ov?”#f87171”:“linear-gradient(90deg,#7c6af7,#34d399)”);
prog.appendChild(fill); hero.appendChild(div(“hero-label”,“Weekly Spending”)); hero.appendChild(amtEl); hero.appendChild(subEl); hero.appendChild(prog);
w.appendChild(hero);

// Quick
var qr=div(“qrow”);
var q1=div(“qcard”); q1.innerHTML=’<div class="qicon" style="background:rgba(124,106,247,.15)">AI</div><div class="qlabel">AI Analysis</div>’; q1.onclick=function(){setPage(“ai”);};
var q2=div(“qcard”); q2.innerHTML=’<div class="qicon" style="background:rgba(167,139,250,.15)">Chat</div><div class="qlabel">AI Advisor</div>’; q2.onclick=function(){setPage(“chat”);};
qr.appendChild(q1); qr.appendChild(q2); w.appendChild(qr);
w.appendChild(div(“sec”,“Categories”));

CATS.forEach(function(cat){
var sp=state.spending[cat.id]||0, bu=state.budgets[cat.id], cov=sp>bu;
var card=div(“card”+(cov?” ov”:””));
card.innerHTML=’<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">’
+’<div style="display:flex;align-items:center;gap:10px">’
+’<div style="width:36px;height:36px;border-radius:10px;background:'+cat.color+'18;display:flex;align-items:center;justify-content:center;font-size:17px">’+cat.icon+’</div>’
+’<div><div style="font-size:13px;font-weight:600">’+cat.label+’</div>’
+’<div style=“font-size:11px;color:’+(cov?”#f87171”:”#333”)+’;margin-top:1px”>’+(cov?”$”+(sp-bu).toFixed(2)+” over”:”$”+(bu-sp).toFixed(2)+” left”)+’</div></div></div>’
+’<div style="text-align:right"><div style=“font-size:17px;font-weight:700;color:’+(cov?”#f87171”:”#f0f0f0”)+’”>$’+sp.toFixed(0)+’</div>’
+’<div style="font-size:11px;color:#333">of $’+bu+’</div></div></div>’
+’<div class="prog"><div class=“prog-fill” style=“width:’+pct(sp,bu)+’%;background:’+(cov?”#f87171”:cat.color)+’”></div></div>’;
w.appendChild(card);
});
s.appendChild(w); return s;
}

function logPage() {
var s=el(“div”,“screen”), w=el(“div”,“pad”);
w.appendChild(div(“title”,“Log Spend”));
w.appendChild(div(“sub”,“Track every transaction.”));

var sb=div(“scan-box”);
if(state.scanning){sb.innerHTML=’<div style="display:flex;flex-direction:column;align-items:center;gap:10px"><div class="spinner"></div><div style="color:#444;font-size:12px">Reading receipt…</div></div>’;}
else{sb.innerHTML=’<div style="display:flex;flex-direction:column;align-items:center;gap:7px"><div style="font-size:32px">Scan</div><div style="color:#555;font-size:13px;font-weight:500">Scan a receipt</div><div style="color:#333;font-size:11px">AI fills it in for you</div></div>’;sb.onclick=function(){var fi=document.createElement(“input”);fi.type=“file”;fi.accept=“image/*”;fi.onchange=function(e){if(e.target.files[0])scanReceipt(e.target.files[0]);};fi.click();};}
w.appendChild(sb);

if(state.scanMsg){var sm=div(””,state.scanMsg.text);sm.style.cssText=“background:”+(state.scanMsg.type===“ok”?“rgba(52,211,153,.08)”:“rgba(248,113,113,.08)”)+”;border:1px solid “+(state.scanMsg.type===“ok”?“rgba(52,211,153,.3)”:“rgba(248,113,113,.3)”)+”;border-radius:10px;padding:10px 13px;margin-bottom:12px;color:”+(state.scanMsg.type===“ok”?”#34d399”:”#f87171”)+”;font-size:13px;font-weight:500”;w.appendChild(sm);}

w.appendChild(el(“span”,“lbl”,“Amount ($)”));
var ai2=el(“input”); ai2.type=“number”; ai2.placeholder=“0.00”; ai2.value=state.logAmt; ai2.style.cssText=“font-size:22px;font-weight:700”; ai2.oninput=function(e){state.logAmt=e.target.value;}; w.appendChild(ai2);
w.appendChild(el(“span”,“lbl”,“Category”));
var cs=el(“select”); CATS.forEach(function(c){var o=el(“option”);o.value=c.id;o.textContent=c.icon+” “+c.label;if(c.id===state.logCat)o.selected=true;cs.appendChild(o);}); cs.onchange=function(e){state.logCat=e.target.value;}; w.appendChild(cs);
w.appendChild(el(“span”,“lbl”,“Note (optional)”));
var ni=el(“input”); ni.type=“text”; ni.placeholder=“What did you buy?”; ni.value=state.logNote; ni.oninput=function(e){state.logNote=e.target.value;}; w.appendChild(ni);
var lb=el(“button”,“btn btn-p”,“Add Transaction”); lb.onclick=addSpend; w.appendChild(lb);

if(state.txns.length>0){
w.appendChild(div(“sec”,“Recent”)).style.marginTop=“20px”;
state.txns.slice(0,3).forEach(function(t){
var ct=CATS.find(function(c){return c.id===t.cat;});
var row=div(“hrow”); row.style.borderLeftColor=t.over?”#f87171”:(ct?ct.color:”#a78bfa”);
row.innerHTML=’<div style="display:flex;align-items:center;gap:9px"><span style="font-size:17px">’+(ct?ct.icon:””)+’</span><div style="font-size:13px;color:#555">’+(ct?ct.label:””)+’</div></div><div style=“font-size:15px;font-weight:700;color:’+(t.over?”#f87171”:”#f0f0f0”)+’”>$’+Number(t.amt).toFixed(2)+’</div>’;
w.appendChild(row);
});
}
s.appendChild(w); return s;
}

function aiPage() {
var s=el(“div”,“screen”), w=el(“div”,“pad”);
w.appendChild(div(“title”,“AI Analysis”));
w.appendChild(div(“sub”,“Predictions and personalised tips.”));
if(state.aiLoading){var c=div(””);c.style.cssText=“display:flex;flex-direction:column;align-items:center;padding:60px 0;gap:12px”;c.appendChild(div(“spinner”));var ld=div(””,“Analysing…”);ld.style.cssText=“color:#444;font-size:13px;animation:pulse 1.5s infinite”;c.appendChild(ld);w.appendChild(c);}
else if(!state.aiData){var c2=div(””);c2.style.cssText=“text-align:center;padding:40px 0”;c2.innerHTML=’<div style="font-size:50px;margin-bottom:12px">AI</div><div style="font-size:16px;font-weight:600;margin-bottom:6px">Spending Analysis</div><div style="font-size:13px;color:#444;line-height:1.6">Get predictions, patterns and tips.</div>’;var ab=el(“button”,“btn btn-p”,“Run Analysis”);ab.style.maxWidth=“200px”;ab.onclick=runAI;c2.appendChild(ab);w.appendChild(c2);}
else{
var ins=state.aiData;
var vc=ins.verdict===“DANGER”?”#f87171”:ins.verdict===“WARNING”?”#fb923c”:”#34d399”;
var vcb=ins.verdict===“DANGER”?“rgba(248,113,113,.1)”:ins.verdict===“WARNING”?“rgba(251,146,60,.1)”:“rgba(52,211,153,.1)”;
var p1=div(“card”); p1.innerHTML=’<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span class="ailbl">Prediction</span><span class="vpill" style="background:'+vcb+';color:'+vc+'">’+ins.verdict+’</span></div><p style="font-size:14px;line-height:1.6;color:#ccc">’+ins.prediction+’</p>’; w.appendChild(p1);
var p2=div(“card”); p2.style.borderColor=“rgba(124,106,247,.2)”; p2.innerHTML=’<span class="ailbl">Insight</span><p style="font-size:13px;line-height:1.7;color:#666;font-style:italic">”’+ins.roast+’”</p>’; w.appendChild(p2);
var p3=div(“card”); p3.innerHTML=’<span class="ailbl">Action Tip</span><p style="font-size:13px;line-height:1.7;color:#34d399">’+ins.tip+’</p>’; p3.style.borderColor=“rgba(52,211,153,.2)”; w.appendChild(p3);
if(ins.patterns&&ins.patterns.length>0){var p4=div(“card”);p4.innerHTML=’<span class="ailbl">Patterns</span>’;ins.patterns.forEach(function(pt){var r=div(””);r.style.cssText=“padding:9px 11px;background:#111;border-radius:8px;border-left:2px solid #a78bfa;margin-bottom:7px;font-size:13px;color:#555;line-height:1.6”;r.textContent=pt;p4.appendChild(r);});w.appendChild(p4);}
var rb=el(“button”,“btn btn-g”,“Run Again”);rb.onclick=runAI;w.appendChild(rb);
}
s.appendChild(w); return s;
}

function chatPage() {
var s=el(“div”,“screen-full”);
var ma=el(“div”); ma.id=“cs”; ma.style.cssText=“flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:10px”;
state.chatMsgs.forEach(function(m){
var row=div(””); row.style.cssText=“display:flex;justify-content:”+(m.role===“user”?“flex-end”:“flex-start”);
var b=div(m.role===“user”?“buser”:“bai”);
if(m.role===“ai”){var lbl=div(””,“AI”);lbl.style.cssText=“font-size:9px;font-weight:700;color:#a78bfa;letter-spacing:1px;margin-bottom:4px”;b.appendChild(lbl);}
var p=el(“p”); p.style.cssText=“font-size:13px;line-height:1.65;margin:0;color:”+(m.role===“user”?”#fff”:”#ccc”); p.textContent=m.text; b.appendChild(p); row.appendChild(b); ma.appendChild(row);
});
if(state.chatLoading){var row2=div(””); row2.style.display=“flex”; var b2=div(“bai”); b2.style.cssText=“display:flex;gap:5px;align-items:center;padding:13px 16px”; [0,1,2].forEach(function(i){var d=div(””); d.style.cssText=“width:6px;height:6px;border-radius:50%;background:#333;animation:bounce 1.2s “+(i*.2)+“s infinite”; b2.appendChild(d);}); row2.appendChild(b2); ma.appendChild(row2);}
s.appendChild(ma);

var qs=div(””); qs.style.cssText=“padding:7px 12px;display:flex;gap:6px;overflow-x:auto;flex-shrink:0;border-top:1px solid #1e1e1e”;
[“Will I overspend?”,“Worst category?”,“How to save more?”].forEach(function(q){var b=el(“button”); b.style.cssText=“background:#161616;border:1px solid #1e1e1e;color:#555;padding:6px 13px;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer;font-family:Inter,sans-serif;font-weight:500;flex-shrink:0”; b.textContent=q; b.onclick=function(){state.chatInput=q;sendChat();}; qs.appendChild(b);});
s.appendChild(qs);

var ir=div(””); ir.style.cssText=“padding:10px 12px 14px;display:flex;gap:8px;flex-shrink:0”;
var inp=el(“input”); inp.type=“text”; inp.placeholder=“Ask about your spending…”; inp.style.cssText=“flex:1;margin-bottom:0;font-size:14px”; inp.value=state.chatInput; inp.oninput=function(e){state.chatInput=e.target.value;}; inp.onkeydown=function(e){if(e.key===“Enter”)sendChat();};
var sb2=el(“button”); sb2.style.cssText=“background:#a78bfa;border:none;border-radius:11px;width:42px;height:42px;color:#fff;font-size:17px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center”; sb2.textContent=” “; sb2.onclick=sendChat;
ir.appendChild(inp); ir.appendChild(sb2); s.appendChild(ir);
return s;
}

function historyPage() {
var s=el(“div”,“screen”), w=el(“div”,“pad”);
w.appendChild(div(“title”,“History”));
w.appendChild(div(“sub”,“All your transactions.”));
if(state.txns.length===0){var em=div(“empty”); em.innerHTML=’<div style="font-size:40px;margin-bottom:10px;opacity:.4">…</div><div style="font-size:13px">No transactions yet.</div>’; w.appendChild(em);}
else{
state.txns.forEach(function(t){
var ct=CATS.find(function(c){return c.id===t.cat;});
var row=div(“hrow”); row.style.borderLeftColor=t.over?”#f87171”:(ct?ct.color:”#a78bfa”);
row.innerHTML=’<div style="display:flex;align-items:center;gap:9px"><div style=“width:34px;height:34px;border-radius:9px;background:’+(ct?ct.color+“18”:”#a78bfa18”)+’;display:flex;align-items:center;justify-content:center;font-size:16px”>’+(ct?ct.icon:””)+’</div><div><div style="font-size:13px;font-weight:500">’+(ct?ct.label:””)+’</div><div style="font-size:11px;color:#333;margin-top:1px">’+t.date+(t.note?”   “+t.note:””)+’</div></div></div><div style="text-align:right"><div style=“font-size:15px;font-weight:700;color:’+(t.over?”#f87171”:”#f0f0f0”)+’”>$’+Number(t.amt).toFixed(2)+’</div><div style=“font-size:10px;color:’+(t.over?”#f87171”:”#34d399”)+’;font-weight:600”>’+(t.over?“Over”:“OK”)+’</div></div>’;
w.appendChild(row);
});
var rb=el(“button”,“btn btn-g”); rb.style.marginTop=“14px”; rb.textContent=“Reset Week”; rb.onclick=function(){if(confirm(“Reset all spending for a new week?”)){state.spending=Object.assign({},DEF_S);state.txns=[];saveState();render();}};
w.appendChild(rb);
}
s.appendChild(w); return s;
}

function settingsPage() {
var s=el(“div”,“screen”), w=el(“div”,“pad”);
w.appendChild(div(“title”,“Settings”));
w.appendChild(div(“sub”,“API key and weekly budgets.”));

var ac=div(“card”); ac.style.marginBottom=“6px”;
var astat=div(””); astat.style.cssText=“display:flex;align-items:center;gap:7px;margin-bottom:11px”;
var dot=div(””); dot.style.cssText=“width:7px;height:7px;border-radius:50%;background:”+(state.apiKey?”#34d399”:”#f87171”);
var atxt=div(””,””); atxt.style.cssText=“font-size:12px;font-weight:500;color:”+(state.apiKey?”#34d399”:”#f87171”); atxt.textContent=state.apiKey?“Key saved   AI active”:“No key   AI disabled”;
astat.appendChild(dot); astat.appendChild(atxt);
var albl=div(””,“Anthropic API Key”); albl.style.cssText=“font-size:12px;font-weight:600;color:#444;margin-bottom:9px”;
var ki=el(“input”); ki.type=“password”; ki.placeholder=state.apiKey?“Enter new key to update”:“sk-ant-api03-…”; ki.style.marginBottom=“0”; ki.oninput=function(e){state.newKey=e.target.value;};
var skb=el(“button”,“btn btn-p”); skb.style.marginTop=“9px”; skb.textContent=“Save Key”; skb.onclick=function(){if(state.newKey){state.apiKey=state.newKey;state.newKey=””;saveState();render();}};
ac.appendChild(albl); ac.appendChild(astat); ac.appendChild(ki); ac.appendChild(skb); w.appendChild(ac);

var divEl=div(“divider”); w.appendChild(divEl);
w.appendChild(div(“sec”,“Weekly Budgets”));
w.appendChild(el(“span”,“lbl”,“Total Budget ($)”));
var ti=el(“input”); ti.type=“number”; ti.value=state.tempB.total; ti.style.cssText=“font-size:20px;font-weight:700”; ti.oninput=function(e){state.tempB=Object.assign({},state.tempB,{total:+e.target.value});};
w.appendChild(ti);
w.appendChild(div(“divider”));

CATS.forEach(function(cat){
var rl=div(””); rl.style.cssText=“display:flex;align-items:center;gap:8px;margin-top:12px;margin-bottom:5px”;
rl.innerHTML=’<span style="font-size:15px">’+cat.icon+’</span><span style="font-size:12px;font-weight:600;color:#444">’+cat.label+’</span>’;
var ci=el(“input”); ci.type=“number”; ci.value=state.tempB[cat.id]; ci.oninput=function(e){var u=Object.assign({},state.tempB);u[cat.id]=+e.target.value;state.tempB=u;};
w.appendChild(rl); w.appendChild(ci);
});

var svb=el(“button”,“btn btn-p”,“Save Budgets”); svb.onclick=function(){state.budgets=Object.assign({},state.tempB);saveState();var t=div(””);t.style.cssText=“position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#34d399;color:#000;padding:9px 20px;border-radius:18px;font-size:13px;font-weight:600;z-index:9999;white-space:nowrap”;t.textContent=“Saved!”;document.body.appendChild(t);setTimeout(function(){t.remove();},1800);render();};
w.appendChild(svb); s.appendChild(w); return s;
}

function guiltOverlay() {
var g=state.guilt;
var ov=div(“overlay”);
var modal=div(“modal”);
var handle=div(””); handle.style.cssText=“width:32px;height:3px;background:#2a2a2a;border-radius:2px;margin:0 auto 18px”;
modal.appendChild(handle);
var icon=div(””); icon.style.cssText=“font-size:36px;text-align:center;margin-bottom:10px”; icon.textContent=”$”; modal.appendChild(icon);
var head=div(””); head.style.cssText=“font-size:20px;font-weight:700;text-align:center;margin-bottom:5px”; head.textContent=g.catOv?“You went over on “+g.catName:“Weekly budget exceeded”;
modal.appendChild(head);

var bd=div(””); bd.style.cssText=“background:#111;border-radius:12px;padding:12px 14px;margin:12px 0”;
if(g.catOv){var r1=div(””);r1.style.cssText=“display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1e1e1e;font-size:13px”;r1.innerHTML=’<span style="color:#444">’+g.catName+’</span><span style="color:#f87171;font-weight:600">$’+g.catSpent.toFixed(2)+’ / $’+g.catBudget+’</span>’;bd.appendChild(r1);}
if(g.totOv){var r2=div(””);r2.style.cssText=“display:flex;justify-content:space-between;padding:5px 0;font-size:13px”;r2.innerHTML=’<span style="color:#444">Weekly Total</span><span style="color:#f87171;font-weight:600">$’+g.totSpent.toFixed(2)+’ / $’+state.budgets.total+’</span>’;bd.appendChild(r2);}
modal.appendChild(bd);

if(state.guiltRoast){var rb2=div(””);rb2.style.cssText=“background:rgba(124,106,247,.07);border:1px solid rgba(124,106,247,.15);border-radius:10px;padding:10px 13px;margin-bottom:13px”;rb2.innerHTML=’<div style="font-size:10px;font-weight:700;color:#a78bfa;margin-bottom:4px">AI INSIGHT</div><p style="color:#555;font-size:13px;line-height:1.6;margin:0">”’+state.guiltRoast+’”</p>’;modal.appendChild(rb2);}
else{var ld2=div(””,“Getting insight…”);ld2.style.cssText=“text-align:center;color:#333;font-size:12px;margin-bottom:13px;animation:pulse 1.5s infinite”;modal.appendChild(ld2);}

var nlbl=div(””,“Add a note (optional)”); nlbl.style.cssText=“font-size:12px;font-weight:600;color:#444;margin-bottom:5px”; modal.appendChild(nlbl);
var ta=document.createElement(“textarea”); ta.placeholder=“What happened? (min 5 chars)”; ta.rows=2; ta.value=state.excuse;
ta.style.cssText=“width:100%;padding:11px 13px;border-radius:10px;font-size:13px;font-family:Inter,sans-serif;margin-bottom:10px;border:1.5px solid #1e1e1e;background:#111;color:#f0f0f0;resize:none”;
var okb=el(“button”,“btn btn-p”,“Got it”); okb.style.cssText+=(state.excuse.trim().length>=5?”;opacity:1”:”;opacity:.4”); okb.style.marginTop=“0”;
ta.oninput=function(e){state.excuse=e.target.value;okb.style.opacity=e.target.value.trim().length>=5?“1”:“0.4”;};
okb.onclick=function(){if(state.excuse.trim().length>=5){state.guilt=null;render();}};
modal.appendChild(ta); modal.appendChild(okb); ov.appendChild(modal); return ov;
}

function bottomNav() {
var nav=el(“div”,“nav”);
var SVGS = {
home:’<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>’,
history:’<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>’,
ai:’<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>’,
settings:’<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>’
};
[{id:“home”,label:“Home”,svg:SVGS.home},{id:“history”,label:“History”,svg:SVGS.history},{id:“log”,add:true},{id:“ai”,label:“AI”,svg:SVGS.ai},{id:“settings”,label:“More”,svg:SVGS.settings}].forEach(function(item){
if(item.add){
var b=div(“addbtn”); b.innerHTML=’<svg viewBox="0 0 24 24" style="width:18px;height:18px" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>’;
b.onclick=function(){setPage(“log”);}; nav.appendChild(b);
} else {
var b2=el(“button”,“nb”+(state.page===item.id?” on”:””)); b2.innerHTML=item.svg+’<span>’+item.label+’</span>’;
b2.onclick=function(){setPage(item.id);}; nav.appendChild(b2);
}
});
return nav;
}

function render() {
var app=document.getElementById(“app”); app.innerHTML=””;
var shell=div(””); shell.style.cssText=“display:flex;flex-direction:column;height:100vh;height:100dvh”;
// Top bar
var tb=div(“topbar”);
var logo=div(“logo”); logo.innerHTML=“No<span>Excuses</span>”;
var oc=overN(), oa=overAll();
var bc=oa?”#f87171”:oc>0?”#fb923c”:”#34d399”;
var bt=oa?“Over budget”:oc>0?oc+” over”:“On track”;
var badge=div(“badge”,bt); badge.style.color=bc; badge.style.borderColor=bc+“30”;
tb.appendChild(logo); tb.appendChild(badge); shell.appendChild(tb);
var pages={home:homePage,log:logPage,ai:aiPage,chat:chatPage,history:historyPage,settings:settingsPage};
shell.appendChild((pages[state.page]||homePage)());
shell.appendChild(bottomNav());
if(state.guilt) shell.appendChild(guiltOverlay());
app.appendChild(shell);
if(state.page===“chat”) setTimeout(scrollChat,50);
}

render();
</script>
