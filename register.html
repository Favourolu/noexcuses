<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NoExcuse — Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --black: #0a0a0a; --white: #f5f2eb; --gold: #e8b84b; --gold-dark: #c49a2a; --red: #e84b4b; --gray: #1a1a1a; --text-muted: #888; }
    body { background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 3rem; border-bottom: 1px solid rgba(232,184,75,0.1); }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.4rem; text-decoration: none; color: var(--white); }
    .logo span { color: var(--gold); }
    .nav-link { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
    .nav-link:hover { color: var(--white); }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; }
    .card { background: var(--gray); border: 1px solid rgba(232,184,75,0.15); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 440px; }
    .card-title { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.4rem; }
    .card-sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; line-height: 1.6; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 0.5rem; }
    .form-group input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.85rem 1rem; color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: var(--gold); }
    .form-group input::placeholder { color: #555; }
    .strength-bar { height: 4px; border-radius: 100px; margin-top: 0.5rem; background: rgba(255,255,255,0.06); overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 100px; transition: all 0.3s; width: 0%; }
    .strength-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.3rem; }
    .msg { border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .msg.error { background: rgba(232,75,75,0.1); border: 1px solid rgba(232,75,75,0.3); color: #ff8080; display: block; }
    .msg.success { background: rgba(46,204,113,0.1); border: 1px solid rgba(46,204,113,0.3); color: #2ecc71; display: block; }
    .btn { width: 100%; background: var(--gold); color: var(--black); padding: 1rem; border-radius: 10px; font-weight: 700; font-size: 1rem; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; margin-top: 0.5rem; }
    .btn:hover { background: var(--gold-dark); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .divider { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin: 1.5rem 0; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: rgba(255,255,255,0.08); }
    .divider::before { left: 0; } .divider::after { right: 0; }
    .login-link { text-align: center; font-size: 0.9rem; color: var(--text-muted); }
    .login-link a { color: var(--gold); text-decoration: none; font-weight: 600; }
  </style>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e8b84b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NoExcuse">
</head>
<body>
  <nav>
    <a href="index.html" class="logo">No<span>Excuse</span></a>
    <a href="login.html" class="nav-link">Already have an account? Login →</a>
  </nav>
  <div class="main">
    <div class="card">
      <h1 class="card-title">Create your account</h1>
      <p class="card-sub">Start your journey to financial discipline. No excuses.</p>
      <div class="msg" id="msgBox"></div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="nameInput" placeholder="e.g. Oluwemimo Adeyemi" />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="emailInput" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="Min. 8 characters" oninput="checkStrength(this.value)" />
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmInput" placeholder="Repeat your password" />
      </div>
      <button class="btn" id="registerBtn" onclick="register()">Create My Account</button>
      <div class="divider">or</div>
      <div class="login-link">Already have an account? <a href="login.html">Login</a></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCXaFZ-tHwK4FXO6ZQ6VZ5_xQxo0mXwPas",
      authDomain: "noexcuse-ac153.firebaseapp.com",
      projectId: "noexcuse-ac153",
      storageBucket: "noexcuse-ac153.firebasestorage.app",
      messagingSenderId: "773313862174",
      appId: "1:773313862174:web:f451fdcee73d378e1aac0f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ── EMAILJS CONFIG ──
    const EMAILJS_SERVICE_ID  = 'service_cbynjhq';
    const EMAILJS_TEMPLATE_ID = 'template_27yytns';
    const EMAILJS_PUBLIC_KEY  = 'xZ4yJFydw_UVWd7Nr';

    async function sendWelcomeEmail(name, email) {
      try {
        await fetch('https://api.emailjs.com/api/v1.0/email/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            service_id: EMAILJS_SERVICE_ID,
            template_id: EMAILJS_TEMPLATE_ID,
            user_id: EMAILJS_PUBLIC_KEY,
            template_params: {
              to_name: name.split(' ')[0],       // first name only
              to_email: email,
              reply_to: 'wemimofavour@gmail.com'
            }
          })
        });
        console.log('Welcome email sent to', email);
      } catch(e) {
        console.log('Email send failed (non-critical):', e);
        // Don't block the user — email failure is silent
      }
    }

    window.checkStrength = function(val) {
      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      if (!val) { fill.style.width = '0%'; label.textContent = ''; return; }
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const levels = [
        { w: '25%', color: '#e84b4b', text: 'Weak' },
        { w: '50%', color: '#e8844b', text: 'Fair' },
        { w: '75%', color: '#e8b84b', text: 'Strong' },
        { w: '100%', color: '#2ecc71', text: 'Very Strong' }
      ];
      const l = levels[score - 1] || levels[0];
      fill.style.width = l.w;
      fill.style.background = l.color;
      label.textContent = l.text;
      label.style.color = l.color;
    }

    function showMsg(msg, type) {
      const el = document.getElementById('msgBox');
      el.textContent = msg;
      el.className = 'msg ' + type;
    }

    window.register = async function() {
      const name = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const confirm = document.getElementById('confirmInput').value;
      const btn = document.getElementById('registerBtn');

      if (!name) { showMsg('Please enter your full name.', 'error'); return; }
      if (!email) { showMsg('Please enter your email.', 'error'); return; }
      if (password.length < 8) { showMsg('Password must be at least 8 characters.', 'error'); return; }
      if (password !== confirm) { showMsg('Passwords do not match.', 'error'); return; }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: name });

        // Save user profile + default categories to Firestore
        const defaultCats = [
          { id: 1, name: 'Bills & Utilities', icon: '🏠', budget: 50000, spent: 0 },
          { id: 2, name: 'Food & Groceries', icon: '🍽️', budget: 40000, spent: 0 },
          { id: 3, name: 'Clothing', icon: '👗', budget: 20000, spent: 0 },
          { id: 4, name: 'Miscellaneous', icon: '💰', budget: 15000, spent: 0 }
        ];
        const currentMonth = new Date().getFullYear() + '-' + (new Date().getMonth() + 1);
        await setDoc(doc(db, 'users', cred.user.uid), {
          name: name,
          email: email,
          createdAt: new Date().toISOString(),
          currentMonth: currentMonth,
          categories: defaultCats,
          expenses: []
        });

        showMsg('🎉 Account created! Check your inbox for a welcome email. If you don\'t see it, check your spam or junk folder. Taking you to your dashboard...', 'success');

        // Send welcome email — non-blocking, runs in background
        sendWelcomeEmail(name, email);

        setTimeout(function() {
          const pending = localStorage.getItem('noexcuse_pending_invite');
          if (pending) {
            localStorage.removeItem('noexcuse_pending_invite');
            window.location.href = pending;
          } else {
            window.location.href = 'dashboard.html';
          }
        }, 1200);
      } catch(e) {
        btn.disabled = false;
        btn.textContent = 'Create My Account';
        if (e.code === 'auth/email-already-in-use') {
          showMsg('An account with this email already exists. Please login.', 'error');
        } else if (e.code === 'auth/invalid-email') {
          showMsg('Please enter a valid email address.', 'error');
        } else {
          showMsg('Error: ' + e.message, 'error');
        }
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') window.register();
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/noexcuses/sw.js');
    }
  </script>

</body>
</html>
