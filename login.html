<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NoExcuse — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --black: #0a0a0a; --white: #f5f2eb; --gold: #e8b84b; --gold-dark: #c49a2a; --red: #e84b4b; --gray: #1a1a1a; --text-muted: #888; }
    body { background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 3rem; border-bottom: 1px solid rgba(232,184,75,0.1); }
    .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.4rem; text-decoration: none; color: var(--white); }
    .logo span { color: var(--gold); }
    .nav-link { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
    .nav-link:hover { color: var(--white); }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; }
    .card { background: var(--gray); border: 1px solid rgba(232,184,75,0.15); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 440px; }
    .card-title { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.4rem; }
    .card-sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; line-height: 1.6; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 0.5rem; }
    .form-group input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.85rem 1rem; color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: var(--gold); }
    .form-group input::placeholder { color: #555; }
    .msg { border-radius: 8px; padding: 0.75rem 1rem; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .msg.error { background: rgba(232,75,75,0.1); border: 1px solid rgba(232,75,75,0.3); color: #ff8080; }
    .msg.success { background: rgba(46,204,113,0.1); border: 1px solid rgba(46,204,113,0.3); color: #2ecc71; }
    .btn { width: 100%; background: var(--gold); color: var(--black); padding: 1rem; border-radius: 10px; font-weight: 700; font-size: 1rem; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; margin-top: 0.5rem; }
    .btn:hover { background: var(--gold-dark); transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .divider { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin: 1.5rem 0; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: rgba(255,255,255,0.08); }
    .divider::before { left: 0; } .divider::after { right: 0; }
    .register-link { text-align: center; font-size: 0.9rem; color: var(--text-muted); }
    .register-link a { color: var(--gold); text-decoration: none; font-weight: 600; }
    .debug { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 0.75rem; font-size: 0.75rem; color: var(--text-muted); margin-top: 1rem; display: none; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">No<span>Excuse</span></a>
    <a href="register.html" class="nav-link">No account? Sign up →</a>
  </nav>
  <div class="main">
    <div class="card">
      <h1 class="card-title">Welcome back 👋</h1>
      <p class="card-sub">Log in and keep your spending in check. No excuses today.</p>
      <div class="msg error" id="errorMsg"></div>
      <div class="msg success" id="successMsg"></div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="emailInput" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="passwordInput" placeholder="Your password" />
      </div>
      <button class="btn" id="loginBtn">Login to NoExcuse</button>
      <div class="debug" id="debugInfo"></div>
      <div class="divider">or</div>
      <div class="register-link">Don't have an account? <a href="register.html">Sign up free</a></div>
    </div>
  </div>

  <script>
    // Show debug info to help troubleshoot
    function showDebug(msg) {
      const el = document.getElementById('debugInfo');
      el.style.display = 'block';
      el.textContent = msg;
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('successMsg').style.display = 'none';
    }

    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('errorMsg').style.display = 'none';
    }

    document.getElementById('loginBtn').addEventListener('click', function() {
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const password = document.getElementById('passwordInput').value;

      // Clear messages
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('successMsg').style.display = 'none';

      // Basic validation
      if (!email) { showError('Please enter your email address.'); return; }
      if (!password) { showError('Please enter your password.'); return; }

      // Get users from storage
      let users = [];
      try {
        const stored = localStorage.getItem('noexcuse_users');
        showDebug('Stored data: ' + (stored ? stored.substring(0, 100) : 'EMPTY - No accounts found!'));
        users = JSON.parse(stored || '[]');
      } catch(e) {
        showError('Storage error: ' + e.message);
        return;
      }

      if (users.length === 0) {
        showError('No accounts found. Please register first!');
        showDebug('localStorage is empty — you need to register on THIS browser first.');
        return;
      }

      // Find user
      const user = users.find(function(u) {
        return u.email.trim().toLowerCase() === email && u.password === password;
      });

      if (!user) {
        const emailOnly = users.find(function(u) {
          return u.email.trim().toLowerCase() === email;
        });
        if (emailOnly) {
          showError('Wrong password. Please check and try again.');
        } else {
          showError('No account found with this email. Please register first.');
          showDebug('Registered emails: ' + users.map(function(u){ return u.email; }).join(', '));
        }
        return;
      }

      // Success!
      showSuccess('Login successful! Taking you to your dashboard...');
      localStorage.setItem('noexcuse_current_user', JSON.stringify({ name: user.name, email: user.email }));
      setTimeout(function() {
        window.location.href = 'dashboard.html';
      }, 1000);
    });

    // Enter key support
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
  </script>

</body>
</html>
