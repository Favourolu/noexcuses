function handleLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.style.display = 'none';

  if (!email || !password) {
    errorMsg.textContent = 'Please enter your email and password.';
    errorMsg.style.display = 'block'; return;
  }

  try {
    const users = JSON.parse(localStorage.getItem('noexcuse_users') || '[]');
    console.log('Users found:', users.length);
    console.log('Looking for:', email);
    
    const user = users.find(u => u.email.toLowerCase().trim() === email.toLowerCase() && u.password === password);
    
    if (!user) {
      // Check if email exists but wrong password
      const emailExists = users.find(u => u.email.toLowerCase().trim() === email.toLowerCase());
      if (emailExists) {
        errorMsg.textContent = 'Wrong password. Please try again.';
      } else {
        errorMsg.textContent = 'No account found with this email. Please register first.';
      }
      errorMsg.style.display = 'block'; return;
    }

    localStorage.setItem('noexcuse_current_user', JSON.stringify({ name: user.name, email: user.email }));
    window.location.href = 'dashboard.html';

  } catch(e) {
    errorMsg.textContent = 'Something went wrong. Please try again.';
    errorMsg.style.display = 'block';
    console.error(e);
  }
}

// Allow pressing Enter to login
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleLogin();
});
